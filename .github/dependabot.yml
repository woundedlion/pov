# Automated bump paths for the SHA-pinned actions and the locked Node/Python
# development toolchains.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      node-development:
        dependency-type: development
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: monthly
    groups:
      python-toolchain:
        patterns:
          - "*"
        exclude-patterns:
          - "clang-format"
          - "actionlint-py"
