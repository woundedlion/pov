# Builds, tests, provenance, lint, firmware budgets, and documentation gates.
name: CI

on:
  # PR branches run through pull_request; direct pushes run on master.
  push:
    branches: [master]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

# PRs share a group; each push SHA gets an independent verdict and bundle.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Native unit tests (Clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: &ccache_maxsize 400M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - &llvm_apt
        name: Add the apt.llvm.org repository
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm-snapshot.gpg.key
          echo '8b2a587ffd672c4687e7581dad4b2f6c1bb2ad6b480cd9771ba2ff48e0b8c75d  /tmp/llvm-snapshot.gpg.key' \
            | sha256sum --check --strict
          sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg /tmp/llvm-snapshot.gpg.key
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update

      - name: Install Clang + Ninja + ccache
        run: |
          sudo apt-get install -y clang-22 ninja-build ccache

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install numpy
        run: pip install --require-hashes -r requirements/numpy.txt

      - name: Install the LUT generator formatter
        run: pip install --require-hashes -r requirements/clang-format.txt

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-tests-${{ github.run_id }}
          restore-keys: ccache-tests-

      - name: Install pinned CMake
        run: pip install --require-hashes -r requirements/cmake.txt

      - name: Configure
        run: >
          cmake --preset tests -DHS_INSTALL_GIT_HOOKS=OFF -DHS_REQUIRE_GENERATORS=ON
          -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22

      - name: Build
        run: cmake --build --preset tests

      - name: Build EXCLUDE_FROM_ALL targets (compile coverage only)
        run: cmake --build --preset tests --target excluded_targets

      - name: ccache stats
        if: always()
        continue-on-error: true
        run: ccache -sv

      - name: Test
        id: native_tests
        env:
          HS_SMOKE_FRAMES: &deep_smoke_frames 120
          HS_EFFECTS_FULL: &quick_effects 0
          HS_REQUIRE_EFFECTS_FULL: &effects_full_optional 0
          HS_SKIPS_ARE_ERRORS: 1
          HS_BUFFER_FREE_WATCHDOG_US: &deep_smoke_watchdog 30000000
        run: >
          ctest --preset tests --output-on-failure --no-tests=error

      - name: Detect MindSplatter replay corpus mismatch
        id: mindsplatter_corpus_mismatch
        if: ${{ always() && steps.native_tests.outcome == 'failure' }}
        shell: bash
        run: |
          generated=build/tests/tests/mindsplatter_replay_corpus.generated.h
          committed=tests/mindsplatter_replay_corpus.h
          if [[ -f "$generated" ]] && ! cmp -s "$committed" "$generated"; then
            echo "mismatch=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload mismatched MindSplatter replay corpus
        if: ${{ always() && steps.mindsplatter_corpus_mismatch.outputs.mismatch == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mindsplatter-replay-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/tests/tests/mindsplatter_replay_corpus.generated.h
          if-no-files-found: error
          retention-days: 3

  sanitizers:
    name: Native unit tests (Clang, ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GENERATED_EXCLUDE: &generated_exclude "^unit_(color_luts|gamut_lut|mindsplatter_replay_form)$"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: *ccache_maxsize
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *llvm_apt

      - name: Install Clang + Ninja + ccache
        run: |
          sudo apt-get install -y clang-22 ninja-build ccache

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-sanitizers-${{ github.run_id }}
          restore-keys: ccache-sanitizers-

      - name: Install pinned CMake
        run: pip install --require-hashes -r requirements/cmake.txt

      - name: Configure
        run: >
          cmake --preset tests -DHS_INSTALL_GIT_HOOKS=OFF -DHS_REQUIRE_GENERATORS=ON -DHS_SANITIZE=ON
          -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O1 -g"
          -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22

      - name: Build
        run: cmake --build --preset tests

      - name: ccache stats
        if: always()
        continue-on-error: true
        run: ccache -sv

      - name: Test
        env:
          HS_SMOKE_FRAMES: *deep_smoke_frames
          HS_EFFECTS_FULL: *quick_effects
          HS_REQUIRE_EFFECTS_FULL: *effects_full_optional
          HS_SKIPS_ARE_ERRORS: 1
          HS_BUFFER_FREE_WATCHDOG_US: *deep_smoke_watchdog
        run: >
          ctest --preset tests --output-on-failure --no-tests=error
          -E "${{ env.GENERATED_EXCLUDE }}"

      - name: Test full-resolution effects under ASan and UBSan
        env:
          HS_SMOKE_FRAMES: *deep_smoke_frames
          HS_EFFECTS_FULL: 1
          HS_REQUIRE_EFFECTS_FULL: 1
          HS_SKIPS_ARE_ERRORS: 1
          HS_BUFFER_FREE_WATCHDOG_US: *deep_smoke_watchdog
        run: >
          ctest --preset tests --output-on-failure --no-tests=error
          -R "^unit_effects_smoke$"

  thread-sanitizer:
    name: Native unit tests (Clang, TSan) / concurrency modules
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: *ccache_maxsize
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *llvm_apt

      - name: Install Clang + Ninja + ccache
        run: |
          sudo apt-get install -y clang-22 ninja-build ccache

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-tsan-${{ github.run_id }}
          restore-keys: ccache-tsan-

      - name: Install pinned CMake
        run: pip install --require-hashes -r requirements/cmake.txt

      - name: Configure
        run: >
          cmake --preset tests -DHS_INSTALL_GIT_HOOKS=OFF -DHS_REQUIRE_GENERATORS=ON -DHS_TSAN=ON
          -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22

      - name: Build
        run: cmake --build --preset tests --target run_tests

      - name: ccache stats
        if: always()
        continue-on-error: true
        run: ccache -sv

      - name: Test
        env:
          HS_SMOKE_FRAMES: *deep_smoke_frames
          HS_SKIPS_ARE_ERRORS: &skips_forbidden 1
          HS_BUFFER_FREE_WATCHDOG_US: *deep_smoke_watchdog
          TSAN_OPTIONS: halt_on_error=1
        run: |
          ctest --preset tests --output-on-failure --no-tests=error -R "^unit_canvas$"
          ctest --preset tests --output-on-failure --no-tests=error -R "^unit_pov_segmented$"

  optimized-tests:
    name: Native unit tests (Clang, optimized) / ${{ matrix.flavor }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: ieee
            optimization: -O2 -g
            float_flags: ""
            test_exclude: *generated_exclude
            skips_are_errors: 1
          - flavor: fastmath
            optimization: -Os -g
            test_exclude: "^unit_(3dmath|sdf|effects|mindsplatter|shapeshifter_tiles|conway_continuity|partition_seam|mesh|shader_chain|shader_workbench|pullback_capture_determinism|pov_sync|color_luts|gamut_lut)$"
            float_flags: -ffast-math -fno-finite-math-only -DHS_TEST_FAST_MATH=1
            skips_are_errors: 0
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: *ccache_maxsize
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *llvm_apt

      - name: Install Clang + Ninja + ccache
        run: |
          sudo apt-get install -y clang-22 ninja-build ccache

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-optimized-${{ matrix.flavor }}-${{ github.run_id }}
          restore-keys: ccache-optimized-${{ matrix.flavor }}-

      - name: Install pinned CMake
        run: pip install --require-hashes -r requirements/cmake.txt

      - name: Configure
        run: >
          cmake --preset tests -DHS_INSTALL_GIT_HOOKS=OFF -DHS_REQUIRE_GENERATORS=ON
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=${{ matrix.optimization }} ${{ matrix.float_flags }}"
          -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22

      - name: Build
        run: cmake --build --preset tests

      - name: ccache stats
        if: always()
        continue-on-error: true
        run: ccache -sv

      - name: Test
        env:
          HS_SMOKE_FRAMES: *deep_smoke_frames
          HS_EFFECTS_FULL: 1
          HS_REQUIRE_EFFECTS_FULL: 1
          HS_SKIPS_ARE_ERRORS: ${{ matrix.skips_are_errors }}
          HS_BUFFER_FREE_WATCHDOG_US: *deep_smoke_watchdog
        run: >
          ctest --preset tests --output-on-failure --no-tests=error
          -E "${{ matrix.test_exclude }}"

  code-coverage:
    name: Native unit tests (Clang) / coverage
    # HS_COVERAGE instruments run_tests only; coverage uses the QUICK tier.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: *ccache_maxsize
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - *llvm_apt

      - name: Install Clang + LLVM + Ninja + ccache
        run: |
          # LLVM profile tools and compiler must share a major version.
          sudo apt-get install -y clang-22 llvm-22 ninja-build ccache

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-coverage-${{ github.run_id }}
          restore-keys: ccache-coverage-

      - name: Install pinned CMake
        run: pip install --require-hashes -r requirements/cmake.txt

      - name: Configure
        run: >
          cmake --preset tests -DHS_INSTALL_GIT_HOOKS=OFF -DHS_REQUIRE_GENERATORS=ON -DHS_COVERAGE=ON
          -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22

      - name: Build
        run: cmake --build --preset tests --target run_tests

      - name: Run the instrumented suite
        # %p separates death-harness children from the parent profile.
        env:
          HS_SMOKE_FRAMES: *deep_smoke_frames
          HS_EFFECTS_FULL: *quick_effects
          HS_REQUIRE_EFFECTS_FULL: *effects_full_optional
          HS_SKIPS_ARE_ERRORS: *skips_forbidden
          HS_BUFFER_FREE_WATCHDOG_US: *deep_smoke_watchdog
          LLVM_PROFILE_FILE: ${{ github.workspace }}/cov/run_tests-%p.profraw
        run: build/tests/tests/run_tests

      - name: Build coverage reports and enforce the floors
        # Explicit bash enables pipefail. The 1% directory floors check presence.
        shell: bash
        run: |
          llvm-profdata-22 merge -sparse -o cov/run_tests.profdata cov/*.profraw
          llvm-cov-22 export build/tests/tests/run_tests \
            -instr-profile=cov/run_tests.profdata \
            -ignore-filename-regex='(^/usr/|/tests/)' \
            -summary-only > cov/summary.json
          llvm-cov-22 export build/tests/tests/run_tests \
            -instr-profile=cov/run_tests.profdata \
            -ignore-filename-regex='(^/usr/|/tests/)' \
            -format=lcov > cov/coverage.lcov
          llvm-cov-22 show build/tests/tests/run_tests \
            -instr-profile=cov/run_tests.profdata \
            -ignore-filename-regex='(^/usr/|/tests/)' \
            -format=html -output-dir=cov/html
          python tools/check_coverage.py cov/summary.json --min-lines 70 \
            --min-directory core/animation=90 \
            --min-directory core/color=85 \
            --min-directory core/control=90 \
            --min-directory core/engine=85 \
            --min-directory core/math=95 \
            --min-directory core/mesh=80 \
            --min-directory core/render=90 \
            --min-directory core/spatial=1 \
            --min-directory core/platform=1 \
            --min-directory hardware=1 \
            --min-directory targets=1
          {
            echo '## Native suite coverage'
            echo
            echo '```'
            llvm-cov-22 report build/tests/tests/run_tests \
              -instr-profile=cov/run_tests.profdata \
              -ignore-filename-regex='(^/usr/|/tests/)'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-coverage
          path: |
            cov/coverage.lcov
            cov/summary.json
            cov/html
          if-no-files-found: error
          retention-days: 30

  windows-tests:
    name: Native unit tests (Windows / Clang)
    # Exercises Windows toolchain discovery without a VS Developer Prompt.
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Load build pins
        id: pins
        run: python tools/build_pins.py --github-output

      # emsdk exercises the lld-link alias-copy branch.
      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ steps.pins.outputs.emsdk }}
          actions-cache-folder: emsdk-cache-${{ steps.pins.outputs.emsdk }}

      - name: Install pinned CMake
        run: pip install --require-hashes -r requirements/cmake.txt

      - name: Configure
        run: cmake --preset tests -DHS_INSTALL_GIT_HOOKS=OFF -DHS_REQUIRE_GENERATORS=ON

      - name: Build
        run: cmake --build --preset tests

      - name: Build EXCLUDE_FROM_ALL targets (compile coverage only)
        run: cmake --build --preset tests --target excluded_targets

      - name: Test
        env:
          HS_SMOKE_FRAMES: *deep_smoke_frames
          HS_EFFECTS_FULL: *quick_effects
          HS_REQUIRE_EFFECTS_FULL: *effects_full_optional
          HS_SKIPS_ARE_ERRORS: 1
          HS_BUFFER_FREE_WATCHDOG_US: *deep_smoke_watchdog
          TEST_EXCLUDE: *generated_exclude
        run: >
          ctest --preset tests --output-on-failure --no-tests=error
          -E "${{ env.TEST_EXCLUDE }}"

      # Windows uses UBSan trap mode; emsdk provides no MSVC ASan runtime.
      - name: Configure + build the UBSan-trap flavour
        run: |
          cmake --preset tests -B build/tests-ubsan -DHS_INSTALL_GIT_HOOKS=OFF -DHS_SANITIZE=ON
          cmake --build build/tests-ubsan --target mindsplatter_replay

      - name: Test the UBSan-trap build
        run: >
          ctest --test-dir build/tests-ubsan --output-on-failure
          --no-tests=error -R "^unit_mindsplatter_replay$"

  wasm:
    name: WASM build (Emscripten)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_MAXSIZE: *ccache_maxsize
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Load build pins
        id: pins
        run: python tools/build_pins.py --github-output

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}

      - name: Install Ninja + ccache
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ steps.pins.outputs.emsdk }}
          actions-cache-folder: build/emsdk-cache-${{ steps.pins.outputs.emsdk }}

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-wasm-${{ github.run_id }}
          restore-keys: ccache-wasm-

      - name: Zero ccache stats
        run: ccache -z

      - name: Install pinned CMake
        run: pip install --require-hashes -r requirements/cmake.txt

      - name: Configure + build WASM (compile check)
        shell: bash
        run: |
          # DAYDREAM_DIR must exist at configure time and contain the install marker.
          mkdir -p "${{ runner.temp }}/daydream-install/src/app"
          touch "${{ runner.temp }}/daydream-install/src/app/daydream.js"
          mkdir -p "${{ runner.temp }}/daydream-install/docs/screenshots"
          touch "${{ runner.temp }}/daydream-install/docs/screenshots/stale.png"
          touch "${{ runner.temp }}/daydream-install/docs/screenshots/unrelated.txt"
          mkdir -p "${{ runner.temp }}/daydream-install/generated/shader/patterns/v1"
          mkdir -p "${{ runner.temp }}/daydream-install/generated/shader/patterns"
          touch "${{ runner.temp }}/daydream-install/generated/shader/patterns/stale.shader.json"
          touch "${{ runner.temp }}/daydream-install/generated/shader/patterns/digest_migration.v1v2.json"
          touch "${{ runner.temp }}/daydream-install/generated/shader/patterns/v1/example.shader.json"
          cmake --preset wasm-release -DDAYDREAM_DIR="${{ runner.temp }}/daydream-install"
          cmake --build --preset wasm-release 2>&1 | tee build/wasm-release-build.log

      - name: Configure + build WASM debug (compile check)
        # Compile coverage for debug-only code and developer bindings.
        shell: bash
        run: |
          cmake --preset wasm-debug -DDAYDREAM_DIR="${{ runner.temp }}/daydream-install" \
            -DHS_WASM_DEV_BINDINGS=ON
          cmake --build --preset wasm-debug 2>&1 | tee build/wasm-debug-build.log

      - name: Configure + build WASM strict-FP (compile check)
        # Compile coverage for the strict-FP capture configuration.
        shell: bash
        run: |
          cmake --preset wasm-strict-fp -DDAYDREAM_DIR="${{ runner.temp }}/daydream-install"
          cmake --build --preset wasm-strict-fp 2>&1 | tee build/wasm-strict-fp-build.log

      - name: First-party WASM warning gate
        # Reject first-party warnings in all three configurations; sysroot warnings are excluded.
        run: |
          logs=(build/wasm-release-build.log build/wasm-debug-build.log
                build/wasm-strict-fp-build.log)
          # grep exits 2 for a missing log, which would otherwise look like no warnings.
          for log in "${logs[@]}"; do
            if [ ! -f "$log" ]; then
              echo "::error::$log missing — the warning capture broke, so the gate proves nothing"
              exit 1
            fi
          done
          if grep -nE '(^|[[:space:]/])(core|effects|workbench|hardware|targets)/[^:[:space:]]+:[0-9]+:([0-9]+:)?[[:space:]]*warning:' "${logs[@]}"; then
            echo "::error::first-party warning(s) in the WASM build — fix them (this target has no baseline)"
            exit 1
          fi
          echo "No first-party warnings in the release, debug or strict-FP WASM build."

      - name: Runtime-smoke WASM debug
        # Debug frames have a 6 KB ceiling; optimized frames use 2 KB.
        env:
          WASM_SMOKE_STACK_CEILING: 6144
        run: node scripts/wasm_smoke.mjs build/wasm-debug/holosphere_wasm.js

      - name: ccache stats
        if: always()
        continue-on-error: true
        run: ccache -sv

      - name: Smoke-test the WASM module at runtime
        run: node scripts/wasm_smoke.mjs build/wasm-release/holosphere_wasm.js

      - name: Exercise install + provenance path
        shell: bash
        # Verify the installed provenance set and both directory installs.
        run: |
          cmake --build --preset wasm-release-install
          dd="${{ runner.temp }}/daydream-install"
          for f in holosphere_wasm.wasm holosphere_wasm.js holosphere_wasm.sha holosphere_wasm.wasm.sha256 holosphere_wasm.toolchain pov_segment_map.json shader/shader_workbench.mjs shader/sha256.mjs shader/engine_catalog.json; do
            if [ ! -f "$dd/generated/$f" ]; then
              echo "::error::install did not produce $f — a consumer in the daydream checkout depends on it"
              exit 1
            fi
          done
          if [ ! -f "$dd/README.md" ]; then
            echo "::error::install did not produce README.md"
            exit 1
          fi
          if ! cmp -s README.md "$dd/README.md"; then
            echo "::error::installed README.md differs from the engine source"
            exit 1
          fi
          if [ -e "$dd/docs/screenshots/stale.png" ]; then
            echo "::error::install retained a stale mirrored screenshot"
            exit 1
          fi
          if [ ! -e "$dd/docs/screenshots/unrelated.txt" ]; then
            echo "::error::install removed unrelated screenshot-directory content"
            exit 1
          fi
          diff -u \
            <(cd docs/screenshots && find . -type f -name '*.png' | sort) \
            <(cd "$dd/docs/screenshots" && find . -type f -name '*.png' | sort)
          # Exercise installed glue after file(CONFIGURE) rewriting.
          node scripts/wasm_smoke.mjs "$dd/generated/holosphere_wasm.js"
          # A clean CI checkout must record a bare 40-hex SHA (no -dirty marker).
          if grep -q -- '-dirty' "$dd/generated/holosphere_wasm.sha"; then
            echo "::error::engine .sha recorded as -dirty on a clean CI checkout"
            cat "$dd/generated/holosphere_wasm.sha"
            exit 1
          fi
          ( cd "$dd/generated" && sha256sum -c holosphere_wasm.wasm.sha256 )
          strings "$dd/generated/holosphere_wasm.wasm" > "$RUNNER_TEMP/wasm-strings.txt"
          if grep -F "$GITHUB_WORKSPACE" "$RUNNER_TEMP/wasm-strings.txt"; then
            echo "::error::release WASM embeds its checkout path and cannot be reproduced in another workspace"
            exit 1
          fi
          # Compare the toolchain marker against the compiler that built the artifact.
          recorded="$(awk '$1 == "emsdk" { print $2 }' "$dd/generated/holosphere_wasm.toolchain")"
          built_with="$("$EMSDK/upstream/emscripten/emcc" -dumpversion)"
          if [ "$recorded" != "$built_with" ]; then
            echo "::error::holosphere_wasm.toolchain records emsdk '$recorded', but this job built with $built_with"
            cat "$dd/generated/holosphere_wasm.toolchain"
            exit 1
          fi
          # The shipped configuration is wasm-release with developer bindings off.
          field() { awk -v k="$1" '$1 == k { print $2 }' "$dd/generated/holosphere_wasm.toolchain"; }
          if [ "$(field build_type)" != "Release" ] || [ "$(field dev_bindings)" != "OFF" ]; then
            echo "::error::holosphere_wasm.toolchain records build_type '$(field build_type)' / dev_bindings '$(field dev_bindings)'; the release install must record Release / OFF"
            cat "$dd/generated/holosphere_wasm.toolchain"
            exit 1
          fi
          echo "Provenance set produced, artifact hashes verified, toolchain recorded:"
          cat "$dd/generated/holosphere_wasm.toolchain"
          bundle="${{ runner.temp }}/holosphere-engine"
          mkdir -p "$bundle/generated"
          cp "$dd/generated"/holosphere_wasm.{js,wasm,sha,wasm.sha256,toolchain} \
            "$dd/generated/pov_segment_map.json" "$bundle/generated/"
          mkdir -p "$bundle/generated/shader/patterns"
          cp "$dd/generated/shader/"{shader_workbench.mjs,sha256.mjs,engine_catalog.json} "$bundle/generated/shader/"
          find "$dd/generated/shader/patterns" -maxdepth 1 -type f \
            \( -name '*.shader.json' -o -name shaderball_migration.json \) \
            -exec cp '{}' "$bundle/generated/shader/patterns/" \;
          test ! -e "$bundle/generated/shader/patterns/digest_migration.v1v2.json"
          test ! -e "$bundle/generated/shader/patterns/v1"
          cp "$dd/README.md" "$bundle/"
          mkdir -p "$bundle/docs/screenshots"
          (
            cd "$dd/docs/screenshots" || exit
            find . -type f -name '*.png' -exec \
              cp --parents '{}' "$bundle/docs/screenshots"/ \;
          )
          (
            cd "$bundle" || exit
            # The manifest is excluded from the input walk.
            # shellcheck disable=SC2094
            find . -type f ! -name holosphere_engine.sha256 -print0 \
              | sort -z \
              | xargs -0 sha256sum > holosphere_engine.sha256
            sha256sum -c holosphere_engine.sha256
          )

      - name: Mirrored shader documents match their sources
        shell: bash
        run: |
          dd="${{ runner.temp }}/daydream-install"
          out="${{ runner.temp }}"
          ( cd patterns && find . -type f \( -name '*.shader.json' -o -name shaderball_migration.json \) ) | sort > "$out/mirror-source.txt"
          test ! -e "$dd/generated/shader/patterns/stale.shader.json"
          test -f "$dd/generated/shader/patterns/digest_migration.v1v2.json"
          test -f "$dd/generated/shader/patterns/v1/example.shader.json"
          ( cd "$dd/generated/shader/patterns" && find . -maxdepth 1 -type f \( -name '*.shader.json' -o -name shaderball_migration.json \) ) | sort > "$out/mirror-installed.txt"
          test -s "$out/mirror-source.txt"
          test -s "$out/mirror-installed.txt"
          diff -u "$out/mirror-source.txt" "$out/mirror-installed.txt"

      - name: Upload verified engine bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: holosphere-engine-${{ github.sha }}
          path: ${{ runner.temp }}/holosphere-engine
          if-no-files-found: error
          retention-days: 90

  lut-provenance:
    name: Generated LUTs match committed header
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install clang-format
        run: pip install --require-hashes -r requirements/clang-format.txt

      - name: Regenerate LUTs and diff the full header
        # Compare generator output directly with the committed header bytes.
        env:
          CLANG_FORMAT: clang-format
        run: |
          "$CLANG_FORMAT" --version
          python3 scripts/generate_luts.py -o /tmp/color_luts.generated.h
          if ! diff -u core/color/color_luts.h /tmp/color_luts.generated.h \
                    > /tmp/color_luts.diff; then
            head -40 /tmp/color_luts.diff
            echo "::error::core/color/color_luts.h is out of sync with scripts/generate_luts.py"
            echo "Regenerate with: python scripts/generate_luts.py -o core/color/color_luts.h"
            exit 1
          fi
          echo "Regenerated header matches core/color/color_luts.h in full."

      - name: Generator self-test (monotonicity + sRGB round-trip)
        run: python3 scripts/generate_luts.py --check

  reaction-graph-provenance:
    name: Generated reaction-graph table matches committed file
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Regenerate reaction-graph table and diff the full file
        run: |
          python3 scripts/generate_reaction_graph.py -o /tmp/reaction_graph.generated.cpp
          if ! diff -u core/spatial/reaction_graph.cpp \
                    /tmp/reaction_graph.generated.cpp > /tmp/reaction_graph.diff; then
            head -40 /tmp/reaction_graph.diff
            echo "::error::core/spatial/reaction_graph.cpp is out of sync with scripts/generate_reaction_graph.py"
            echo "Regenerate with: python scripts/generate_reaction_graph.py"
            exit 1
          fi
          echo "Regenerated table matches core/spatial/reaction_graph.cpp in full."

  gamut-lut-provenance:
    name: Generated gamut LUT matches committed file
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install numpy
        run: pip install --require-hashes -r requirements/numpy.txt

      - name: Check gamut LUT provenance and the color.h/3dmath.h mirrors
        run: |
          python3 tools/gen_gamut_lut.py --check

  srgb-decode-provenance:
    name: Generated sRGB decode tables match committed header
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *llvm_apt

      - name: Install Clang + Ninja
        run: |
          sudo apt-get install -y clang-22 ninja-build

      - name: Install pinned CMake
        run: pip install --require-hashes -r requirements/cmake.txt

      - name: Build the generator
        run: |
          cmake --preset tests -DHS_INSTALL_GIT_HOOKS=OFF -DHS_REQUIRE_GENERATORS=ON \
            -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22
          cmake --build --preset tests --target srgb_decode_gen

      - name: Regenerate the decode tables and diff the full header
        run: |
          ./build/tests/tests/srgb_decode_gen /tmp/srgb_decode_lut.generated.h
          if ! diff -u core/color/srgb_decode_lut.h \
                    /tmp/srgb_decode_lut.generated.h > /tmp/srgb_decode_lut.diff; then
            head -40 /tmp/srgb_decode_lut.diff
            echo "::error::core/color/srgb_decode_lut.h is out of sync with scripts/generate_srgb_decode.cpp"
            echo "Regenerate with: cmake --build --preset tests --target srgb_decode_gen && ./build/tests/tests/srgb_decode_gen"
            exit 1
          fi
          echo "Regenerated tables match core/color/srgb_decode_lut.h in full."

  patterns-provenance:
    name: Promoted shader documents match their generator
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Load build pins
        id: pins
        run: python tools/build_pins.py --github-output

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}

      # --check regenerates owned documents and normalizes line endings.
      - name: Check promoted shader document provenance
        run: node scripts/generate_promoted_shader_documents.mjs --check

  scripts-unit-tests:
    name: scripts/*.test.mjs unit suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
