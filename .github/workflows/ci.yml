# Builds, tests, provenance, lint, firmware budgets, and documentation gates.
name: CI

on:
  # PR branches run through pull_request; direct pushes run on master.
  push:
    branches: [master]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

# Native builds emit line-table debug info; see HS_LINE_TABLES_ONLY.
env:
  HS_LINE_TABLES_ONLY: 'ON'

# PRs share a group; each push SHA gets an independent verdict and bundle.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sanitizers:
    name: Native unit tests (Clang, ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: &ccache_maxsize 1G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - &llvm_apt
        name: Add the apt.llvm.org repository
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm-snapshot.gpg.key
          echo '8b2a587ffd672c4687e7581dad4b2f6c1bb2ad6b480cd9771ba2ff48e0b8c75d  /tmp/llvm-snapshot.gpg.key' \
            | sha256sum --check --strict
          sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg /tmp/llvm-snapshot.gpg.key
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update

      - &install_clang_tools
        name: Install Clang + Ninja + ccache
        run: |
          sudo apt-get install -y clang-22 ninja-build ccache

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-sanitizers-${{ github.run_id }}
          restore-keys: ccache-sanitizers-

      - &ccache_zero
        name: Zero ccache statistics
        run: ccache -z

      - &install_pinned_cmake
        name: Install pinned CMake
        run: |
          pip install --require-hashes -r requirements/cmake.txt
          python tools/build_pins.py --check-tool cmake

      - name: Configure
        run: >
          cmake --preset tests -DHS_INSTALL_GIT_HOOKS=OFF -DHS_REQUIRE_GENERATORS=ON -DHS_SANITIZE=ON
          -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O1 -g"
          -DCMAKE_CXX_COMPILER=clang++-22

      - name: Build
        run: cmake --build --preset tests

      - name: ccache stats
        if: always()
        continue-on-error: true
        run: ccache -sv

      - name: Test
        shell: bash
        env:
          HS_SMOKE_FRAMES: &deep_smoke_frames 120
          HS_EFFECTS_FULL: 0
          HS_REQUIRE_EFFECTS_FULL: 0
          HS_SKIPS_ARE_ERRORS: 1
          HS_BUFFER_FREE_WATCHDOG_US: &deep_smoke_watchdog 30000000
        run: |
          . tools/ci/common.sh
          ctest --preset tests --output-on-failure --no-tests=error -E "$GENERATED_TESTS"

      - name: Test full-resolution effects under ASan and UBSan
        env:
          HS_SMOKE_FRAMES: *deep_smoke_frames
          HS_EFFECTS_FULL: 1
          HS_REQUIRE_EFFECTS_FULL: 1
          HS_SKIPS_ARE_ERRORS: 1
          HS_BUFFER_FREE_WATCHDOG_US: *deep_smoke_watchdog
        run: >
          ctest --preset tests --output-on-failure --no-tests=error
          -R "^unit_effects_smoke$"

      - name: Save ccache on master
        if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-sanitizers-${{ github.run_id }}

  thread-sanitizer:
    name: Native unit tests (Clang, TSan) / concurrency modules + physical display
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: *ccache_maxsize
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - *llvm_apt

      - *install_clang_tools

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-tsan-${{ github.run_id }}
          restore-keys: ccache-tsan-

      - *ccache_zero

      - *install_pinned_cmake

      - name: Configure
        run: >
          cmake --preset tests -DHS_INSTALL_GIT_HOOKS=OFF -DHS_REQUIRE_GENERATORS=ON -DHS_TSAN=ON
          -DCMAKE_CXX_COMPILER=clang++-22

      - name: Build
        run: cmake --build --preset tests --target run_tests

      - name: ccache stats
        if: always()
        continue-on-error: true
        run: ccache -sv

      - name: Test
        env:
          HS_SMOKE_FRAMES: *deep_smoke_frames
          HS_SKIPS_ARE_ERRORS: 1
          HS_BUFFER_FREE_WATCHDOG_US: *deep_smoke_watchdog
          TSAN_OPTIONS: halt_on_error=1
        run: |
          ctest --preset tests --output-on-failure --no-tests=error -R "^unit_canvas$"
          ctest --preset tests --output-on-failure --no-tests=error -R "^unit_pov_segmented$"

      - name: Compile the EXCLUDE_FROM_ALL targets
        run: cmake --build --preset tests --target excluded_targets

      - name: Test physical display plot and scan
        run: bash tools/ci/p1_plot_scan.sh -DCMAKE_CXX_COMPILER=clang++-22

      - name: Save ccache on master
        if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-tsan-${{ github.run_id }}

  optimized-tests:
    name: Native unit tests (Clang, optimized) / ${{ matrix.flavor }}
    strategy:
      fail-fast: false
      matrix:
        # tools/ci/optimized.sh holds each flavour's flags and test selection.
        flavor: [ieee, fastmath, ndebug-death]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: *ccache_maxsize
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - *llvm_apt

      - *install_clang_tools

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-optimized-${{ matrix.flavor }}-${{ github.run_id }}
          restore-keys: ccache-optimized-${{ matrix.flavor }}-

      - *ccache_zero

      - *install_pinned_cmake

      - name: Configure, build and test
        run: bash tools/ci/optimized.sh "${{ matrix.flavor }}" -DCMAKE_CXX_COMPILER=clang++-22

      - name: ccache stats
        if: always()
        continue-on-error: true
        run: ccache -sv

      - name: Save ccache on master
        if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-optimized-${{ matrix.flavor }}-${{ github.run_id }}

  code-coverage:
    name: Native unit tests (Clang) / coverage
    # HS_COVERAGE instruments the umbrella and its shared objects; coverage uses the QUICK tier.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: *ccache_maxsize
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - *llvm_apt

      - name: Install Clang + LLVM + Ninja + ccache
        run: |
          # LLVM profile tools and compiler must share a major version.
          sudo apt-get install -y clang-22 llvm-22 ninja-build ccache

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-coverage-${{ github.run_id }}
          restore-keys: ccache-coverage-

      - *ccache_zero

      - *install_pinned_cmake

      - name: Configure
        run: >
          cmake --preset tests -DHS_INSTALL_GIT_HOOKS=OFF -DHS_REQUIRE_GENERATORS=ON -DHS_COVERAGE=ON
          -DCMAKE_CXX_COMPILER=clang++-22

      - name: Build
        run: cmake --build --preset tests --target run_tests

      - name: Run the instrumented suite
        # %p separates death-harness children from the parent profile.
        env:
          HS_SMOKE_FRAMES: *deep_smoke_frames
          HS_EFFECTS_FULL: 0
          HS_REQUIRE_EFFECTS_FULL: 0
          HS_SKIPS_ARE_ERRORS: 1
          HS_BUFFER_FREE_WATCHDOG_US: *deep_smoke_watchdog
          LLVM_PROFILE_FILE: ${{ github.workspace }}/cov/run_tests-%p.profraw
        run: build/tests/tests/run_tests

      - name: Build coverage reports and enforce the floors
        # Explicit bash enables pipefail. The 1% directory floors check presence.
        shell: bash
        run: |
          llvm-profdata-22 merge -sparse -o cov/run_tests.profdata cov/*.profraw
          llvm-cov-22 export build/tests/tests/run_tests \
            -instr-profile=cov/run_tests.profdata \
            -ignore-filename-regex='(^/usr/|/tests/)' \
            -summary-only > cov/summary.json
          llvm-cov-22 export build/tests/tests/run_tests \
            -instr-profile=cov/run_tests.profdata \
            -ignore-filename-regex='(^/usr/|/tests/)' \
            -format=lcov > cov/coverage.lcov
          llvm-cov-22 show build/tests/tests/run_tests \
            -instr-profile=cov/run_tests.profdata \
            -ignore-filename-regex='(^/usr/|/tests/)' \
            -format=html -output-dir=cov/html
          python tools/check_coverage.py cov/summary.json --min-lines 70 \
            --min-directory core/animation=90 \
            --min-directory core/color=85 \
            --min-directory core/containers=1 \
            --min-directory core/control=90 \
            --min-directory core/engine=85 \
            --min-directory core/math=95 \
            --min-directory core/memory=1 \
            --min-directory core/mesh=80 \
            --min-directory core/pattern=1 \
            --min-directory core/render=90 \
            --min-directory core/spatial=1 \
            --min-directory core/platform=1 \
            --min-directory hardware=1 \
            --min-directory targets=1 \
            --min-directory effects=1 \
            --min-directory workbench=1
          {
            echo '## Native suite coverage'
            echo
            echo '```'
            llvm-cov-22 report build/tests/tests/run_tests \
              -instr-profile=cov/run_tests.profdata \
              -ignore-filename-regex='(^/usr/|/tests/)'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install the generated-table pins' numpy and formatter
        run: |
          pip install --require-hashes -r requirements/numpy.txt
          pip install --require-hashes -r requirements/clang-format.txt

      - name: Test generated-table pins
        shell: bash
        run: |
          . tools/ci/common.sh
          ctest --preset tests --output-on-failure --no-tests=error -R "$GENERATED_TESTS"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-coverage
          path: |
            cov/coverage.lcov
            cov/summary.json
            cov/html
          if-no-files-found: error
          retention-days: 30

      - name: Save ccache on master
        if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-coverage-${{ github.run_id }}

  wasm:
    name: WASM build (Emscripten)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Load build pins
        id: pins
        run: python tools/build_pins.py --github-output

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}

      - name: Install Ninja + ccache
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ steps.pins.outputs.emsdk }}
          actions-cache-folder: build/emsdk-cache-${{ steps.pins.outputs.emsdk }}

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-wasm-${{ github.run_id }}
          restore-keys: ccache-wasm-

      - name: Zero ccache stats
        run: ccache -z

      - *install_pinned_cmake

      - name: Build, gate, smoke and install WASM
        shell: bash
        run: bash tools/ci/wasm.sh "${{ runner.temp }}/daydream-install"

      - name: ccache stats
        if: always()
        continue-on-error: true
        run: ccache -sv

      - name: Package verified engine bundle
        shell: bash
        run: |
          dd="${{ runner.temp }}/daydream-install"
          bundle="${{ runner.temp }}/holosphere-engine"
          mkdir -p "$bundle/generated"
          cp "$dd/generated"/holosphere_wasm.{js,wasm,sha,wasm.sha256,toolchain} \
            "$dd/generated/pov_segment_map.json" "$dd/generated/"{holosphere_wasm.d.ts,holosphere_bindings.d.ts,engine_types.d.ts,engine_contract.mjs,segment_geometry.js,segment_geometry.d.ts} "$bundle/generated/"
          mkdir -p "$bundle/generated/shader/patterns"
          cp "$dd/generated/shader/"{composed_effect_roster.mjs,shader_workbench.mjs,sha256.mjs,engine_catalog.json} "$bundle/generated/shader/"
          find "$dd/generated/shader/patterns" -maxdepth 1 -type f \
            \( -name '*.shader.json' -o -name catalog.json \) \
            -exec cp '{}' "$bundle/generated/shader/patterns/" \;
          cp "$dd/README.md" "$bundle/"
          mkdir -p "$bundle/docs/screenshots"
          (
            cd "$dd/docs/screenshots" || exit
            find . -type f -name '*.png' -exec \
              cp --parents '{}' "$bundle/docs/screenshots"/ \;
          )
          (
            cd "$bundle" || exit
            # The manifest is excluded from the input walk.
            # shellcheck disable=SC2094
            find . -type f ! -name holosphere_engine.sha256 -print0 \
              | sort -z \
              | xargs -0 sha256sum > holosphere_engine.sha256
            sha256sum -c holosphere_engine.sha256
          )

      - name: Upload verified engine bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: holosphere-engine-${{ github.sha }}
          path: ${{ runner.temp }}/holosphere-engine
          if-no-files-found: error
          retention-days: 90

      - name: Save ccache on master
        if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-wasm-${{ github.run_id }}

  lut-provenance:
    name: Generated LUTs match committed header
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install clang-format
        run: pip install --require-hashes -r requirements/clang-format.txt

      - name: Regenerate LUTs, diff the full header, and self-test the generator
        run: bash tools/ci/lut_provenance.sh

  reaction-graph-provenance:
    name: Generated reaction-graph table matches committed file
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Regenerate reaction-graph table and diff the full file
        run: bash tools/ci/reaction_graph_provenance.sh
  # Standalone provenance checks validate bytes; required generator CTests also validate CTest wiring.
  gamut-lut-provenance:
    name: Generated gamut LUT matches committed file
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install numpy
        run: pip install --require-hashes -r requirements/numpy.txt

      - name: Check gamut LUT provenance and the color_space.h/3dmath.h mirrors
        run: |
          python3 tools/gen_gamut_lut.py --check

  srgb-decode-provenance:
    name: Generated sRGB decode tables match committed header
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - *llvm_apt

      - name: Install Clang + Ninja
        run: |
          sudo apt-get install -y clang-22 ninja-build

      - *install_pinned_cmake

      - name: Regenerate the decode tables and diff the full header
        run: bash tools/ci/srgb_decode_provenance.sh -DCMAKE_CXX_COMPILER=clang++-22

  patterns-provenance:
    name: Promoted shader documents match their generator
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Load build pins
        id: pins
        run: python tools/build_pins.py --github-output

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}

      # --check regenerates owned documents and normalizes line endings.
      - name: Check promoted shader document and composed preset provenance
        run: bash tools/ci/patterns_provenance.sh

  scripts-unit-tests:
    name: JavaScript unit suite and browser capture helper
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Load build pins
        id: pins
        run: python tools/build_pins.py --github-output

      - *install_pinned_cmake

      # The unit suite uses no npm dependencies.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}

      # The runner rejects empty file selections, cases, and assertion counts.
      - name: Every scripts/*.test.mjs unit test and the browser capture helper
        run: bash tools/ci/scripts_tests.sh --with-deps

  screenshot-gallery:
    name: Screenshot gallery, profile archive and effect roster
    # Checks gallery membership and PNG integrity; pixel freshness requires recapture.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Load build pins
        id: pins
        run: python tools/build_pins.py --github-output

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}

      - name: Capture script parses; gallery and profile archive cover every effect
        run: bash tools/ci/screenshot_gallery.sh

  docs-images:
    name: Documented image references resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Every documented image reference resolves
        run: python tools/docs_images.py

  docs-markdown:
    name: Tracked Markdown is valid
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Load build pins
        id: pins
        run: python tools/build_pins.py --github-output

      # The exhaustive daydream file map is checked against its committed pin.
      - name: Check out daydream tree-fence target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: woundedlion/daydream
          ref: ${{ steps.pins.outputs.daydream }}
          path: daydream
          persist-credentials: false

      # --sync would repair drift before the check; CI only validates.
      - name: Validate tracked Markdown, build pins and ignore rules
        run: bash tools/ci/docs_markdown.sh daydream

  license-headers:
    name: License headers match LICENSE
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check tracked license headers
        run: |
          python tools/license_check.py

  lint:
    name: Lint (Python + JavaScript + shell + justfile + workflows)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Load build pins
        id: pins
        run: python tools/build_pins.py --github-output

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}

      - name: Install lint tools
        run: |
          pip install --require-hashes -r requirements/ruff.txt -r requirements/just.txt -r requirements/shellcheck.txt
          npm ci --no-audit --no-fund

      - name: Install actionlint
        run: |
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin"
          tar -xzf actionlint.tar.gz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"


      - name: Lint
        run: just lint

  clang-format:
    name: Formatting (clang-format)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install clang-format
        run: pip install --require-hashes -r requirements/clang-format.txt

      - name: Check formatting
        run: |
          clang-format --version
          bash tools/clang_format_gate.sh

  pcb-tests:
    name: PCB generation and fabrication (KiCad 10.0.4)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The job still reports, so ci-green does not wait on a skipped check.
      - name: Detect PCB input changes
        id: pcb
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          . tools/ci/common.sh
          run=true
          if [ "$EVENT" != workflow_dispatch ] && [ -n "$BASE" ] &&
             [ "$BASE" != 0000000000000000000000000000000000000000 ] &&
             git fetch --quiet --depth=1 origin "$BASE" &&
             ! git diff --name-only "$BASE" HEAD |
               grep -qE "$PCB_INPUTS"; then
            run=false
            echo "No PCB inputs changed since $BASE; skipping the PCB suite."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.pcb.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Install pinned KiCad and stock libraries
        if: steps.pcb.outputs.run == 'true'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'kicad-10.0.4-x86_64.exe'
          $url = 'https://github.com/KiCad/kicad-source-mirror/releases/download/10.0.4/kicad-10.0.4-x86_64.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          $expected = '0542f21d8f33d4bc530768c97bfe1ecd495a88050b361d1864c12b1e7c9430cd'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expected) {
            throw 'KiCad installer SHA256 does not match the pinned release'
          }
          $process = Start-Process -FilePath $installer -ArgumentList '/allusers', '/S' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            throw "KiCad installer failed: $($process.ExitCode)"
          }

      - name: Configure pinned KiCad and stock libraries
        if: steps.pcb.outputs.run == 'true'
        shell: pwsh
        run: |
          $env:KICAD_CONFIG_HOME = Join-Path $env:RUNNER_TEMP 'kicad-config'
          "KICAD_CONFIG_HOME=$env:KICAD_CONFIG_HOME" >> $env:GITHUB_ENV
          python tools/ci/kicad_config.py $env:KICAD_CONFIG_HOME

      - name: Run PCB generation, DRC, parity and fabrication tests
        if: steps.pcb.outputs.run == 'true'
        run: python tools/run_python_tests.py --suite hardware/phantasm/gen/tests

  python-tests:
    name: Python tooling tests and PCB metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: pip install --require-hashes -r requirements/numpy.txt -r requirements/ruff.txt -r requirements/shellcheck.txt
      - *install_pinned_cmake
      - name: Run all Python suites; check routed candidates and PCB metadata
        run: bash tools/ci/python_tests.sh

  teensy-size:
    name: Teensy 4 firmware (build + size + layout)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0  # PlatformIO is a Python package
        with:
          python-version: '3.12'
      - name: Cache PlatformIO toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-teensy-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-teensy-
      - name: Cache build objects
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pio/build_cache
          key: pio-objs-${{ hashFiles('platformio.ini') }}-${{ github.sha }}
          restore-keys: pio-objs-${{ hashFiles('platformio.ini') }}-
      - name: Install pinned PlatformIO
        run: pip install --require-hashes -r requirements/platformio.txt
      - name: Build + size + layout gate, then compile the profiling variants
        # Shipping environments enforce budgets; other environments provide compile coverage.
        run: bash tools/ci/teensy_size.sh "${{ runner.temp }}"

      - name: Cap build-object cache
        # Drop the oldest cached objects above 400 MB; config and the signature db stay.
        shell: bash
        run: |
          find .pio/build_cache -mindepth 2 -type f -printf '%T@ %s %p\n' | sort -rn |
            awk -v cap=$((400 * 1024 * 1024)) '{ total += $2 } total > cap { print $3 }' |
            xargs -r rm -f
      - name: Save build objects
        if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pio/build_cache
          key: pio-objs-${{ hashFiles('platformio.ini') }}-${{ github.sha }}
      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: teensy-firmware
          path: |
            .pio/build/*/firmware.*
            .pio/build/*/hot_layout/report.txt
          if-no-files-found: warn

  teensy-warnings:
    name: Teensy 4 firmware (no first-party warnings)
    # Warning coverage requires a cold build of every first-party translation unit.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0  # PlatformIO is a Python package
        with:
          python-version: '3.12'

      - name: Cache PlatformIO toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-teensy-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-teensy-
      - name: Install pinned PlatformIO
        run: pip install --require-hashes -r requirements/platformio.txt
      - name: Cold build + zero first-party warning gate (all targets)
        # An empty PLATFORMIO_BUILD_CACHE_DIR is ignored; remove both cache and build outputs.
        run: bash tools/ci/teensy_warnings.sh --github

  docs-doxygen:
    name: Doxygen build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: ./.github/actions/pinned-doxygen

      - name: Generate docs and enforce documentation coverage
        run: bash tools/ci/docs_doxygen.sh

  render-hash-report:
    name: Render-hash report (non-blocking)
    # Report only: the report and cache steps continue on error, so a failed
    # report never fails the job ci-green needs.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: *ccache_maxsize
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - *llvm_apt

      - *install_clang_tools

      - name: Restore ccache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-render-hashes-${{ github.run_id }}
          restore-keys: ccache-render-hashes-

      - *install_pinned_cmake

      - name: Compare render hashes with the parent
        id: report
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash tools/ci/render_hash_report.sh "$BASE_SHA" -DCMAKE_CXX_COMPILER=clang++-22

      - name: Note an incomplete report
        if: steps.report.outcome != 'success'
        run: printf '## Render-hash report\n\nThe report step did not complete.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Save ccache on master
        if: github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-render-hashes-${{ github.run_id }}

  ci-green:
    name: CI green
    # Branch protection requires ci-green; always() prevents failed dependencies from skipping it.
    needs:
      - sanitizers
      - thread-sanitizer
      - optimized-tests
      - code-coverage
      - wasm
      - lut-provenance
      - reaction-graph-provenance
      - gamut-lut-provenance
      - srgb-decode-provenance
      - patterns-provenance
      - scripts-unit-tests
      - screenshot-gallery
      - docs-images
      - docs-markdown
      - docs-doxygen
      - license-headers
      - lint
      - clang-format
      - python-tests
      - pcb-tests
      - teensy-size
      - teensy-warnings
      - render-hash-report
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert every job is a dependency and succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          WF=.github/workflows/ci.yml

          # Job keys are the two-space-indented keys after jobs:.
          awk '
            /^jobs:[[:space:]]*(#.*)?$/ { injobs = 1; next }
            injobs && /^[^[:space:]]/ { injobs = 0 }
            injobs && /^  [A-Za-z0-9_-]+:[[:space:]]*(#.*)?$/ {
              sub(/^  /, ""); sub(/:[[:space:]]*(#.*)?$/, ""); print
            }
          ' "$WF" | grep -vx ci-green | sort > /tmp/ci-jobs.txt
          # An empty extraction would make the comparison pass vacuously.
          [ -s /tmp/ci-jobs.txt ] || {
            echo "::error file=$WF::no top-level job keys parsed, so the needs check proves nothing"
            exit 1
          }

          python3 - <<'PY' > /tmp/ci-results.txt
          import json, os
          for job, meta in sorted(json.loads(os.environ["RESULTS"]).items()):
              print(job, meta["result"])
          PY
          cut -d" " -f1 /tmp/ci-results.txt | sort > /tmp/ci-needs.txt

          missing=$(comm -23 /tmp/ci-jobs.txt /tmp/ci-needs.txt)
          if [ -n "$missing" ]; then
            for j in $missing; do
              echo "::error file=$WF::job '$j' is absent from ci-green's needs, so the aggregate status would go green without it"
            done
            exit 1
          fi

          awk '$2 != "success" { print }' /tmp/ci-results.txt > /tmp/ci-bad.txt
          if [ -s /tmp/ci-bad.txt ]; then
            while read -r job result; do
              if [ "$result" = skipped ]; then
                echo "::error file=$WF::job '$job' was skipped, so its checks did not run"
              else
                echo "::error::job '$job' did not pass: $result"
              fi
            done < /tmp/ci-bad.txt
            exit 1
          fi
          echo "CI green: $(wc -l < /tmp/ci-results.txt) jobs, every one success."
