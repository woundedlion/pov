# Presubmit CI — builds and runs the native unit suite, and compiles the WASM
# module, on master pushes and pull-request updates. This is the cloud
# counterpart of the local .githooks/pre-commit gate.
name: CI

on:
  # Restrict push to master: a push to a PR branch already fires the
  # pull_request event, and the two runs key on different refs
  # (refs/heads/* vs refs/pull/*/merge) so neither concurrency-cancels the
  # other. Limiting push avoids that double-run while still covering
  # direct-to-master pushes that open no PR.
  push:
    branches: [master]
  # No path filter: a docs-only PR must still run the Markdown, image,
  # license-header, and screenshot-gallery gates.
  pull_request:

# Every actions/checkout step below also passes persist-credentials: false. The
# token authenticates the fetch and is not wanted afterwards: no job here
# pushes, calls gh, or reads GITHUB_TOKEN, and leaving it in .git/config would
# expose it to every third-party lifecycle script a build runs (npm ci, the
# PlatformIO toolchain downloads, emsdk provisioning).
permissions:
  contents: read

# Cancel superseded PR runs on the same ref to save CI minutes. Master pushes
# queue instead: back-to-back landings share refs/heads/master, and cancelling
# leaves the earlier commit with a cancelled — neither green nor visibly red —
# verdict. master is also the only ref that runs windows-tests and the FULL
# effects tier (optimized-tests shard 3 under IEEE, and its fastmath entry under
# the shipping float pair), so a cancelled landing takes their sole run with it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Native unit tests (Clang) / shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        # Shards partition all registered module tests plus the standalone
        # checks (color_luts provenance + its generator --check, fastmath_clamp
        # release-flag, h_offset_renorm device-offset, mindsplatter_replay
        # corpus gate, stack_budget, arena_budget, and the module_roster /
        # module_includes roster pins and mirrored-screenshot prune) so every
        # registered test runs in exactly one job.
        # SINGLE SOURCE OF TRUTH: the sanitizers job references this same anchored
        # list (*shard_matrix), and the shard-coverage job (which references the
        # per-shard anchors) asserts the shard alternatives and the registered
        # tests are in bijection — so a
        # module added to CMake but to no shard fails CI instead of silently
        # running in zero Linux/sanitizer jobs, and an alternative left behind by
        # a rename fails instead of accumulating. Adjust groupings here only.
        include: &shard_matrix
          - &shard1_entry
            shard: 1
            test_regex: &shard1_re "^unit_(3dmath|concepts|memory|spatial|scb|sdf|conway|conway_continuity|partition_seam|hankin|hyper_lattice|geometry|opchain_probe|opchain_arena_survey|module_roster|module_includes|case_calls|anim_pack|vendor_patches|linker_patches|teensy_size_trail|mirrored_screenshot_prune)$"
            test_exclude: &generated_exclude "^unit_(color_luts|color_luts_check|gamut_lut|mindsplatter_replay_form)$"
            skips_are_errors: 1
          - &shard2_entry
            shard: 2
            test_regex: &shard2_re "^unit_(mesh|solids|reaction_graph|color|color_luts|color_luts_check|gamut_lut|mindsplatter_palette_form|mindsplatter_replay_form|palettes|easing_waves|interpolate|platform|profiling|filter|plot_scan|fastmath_clamp|conway_soak|spherical_field|relax_bake_verify|relax_bake_form)$"
            test_exclude: *generated_exclude
            skips_are_errors: 1
          - &shard3_entry
            shard: 3
            test_regex: &shard3_re "^unit_(canvas|scan|mesh_raster|transformers|noise|noise_field|projections|animation|effects|mindsplatter|effects_smoke|effect_factory|shader_workbench|lattice_melt|kaleidoscope_smooth|composed_effect|shapeshifter_oracle|shapeshifter_tiles|mindsplatter_replay|mindsplatter_palette|h_offset_renorm|stack_budget|arena_budget)$"
            test_exclude: *generated_exclude
            skips_are_errors: 1
            effects_full: 1
          - &shard4_entry
            shard: 4
            test_regex: &shard4_re "^unit_(dma_core|hd107s|dma_controller|led|pov_segmented|pov_segment_map_golden|pov_single|pov_sync|param_marshal|wasm_predicates|presets|styles|shading|death|conway_morph|pullback|pullback_manifest|pullback_capture_determinism|shader_chain)$"
            test_exclude: *generated_exclude
            skips_are_errors: 1
    # Pinned image (not ubuntu-latest) so the apt clang version is deterministic
    # and the suite isn't silently re-hosted on a new runner image.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # Every ccache key carries github.run_id, so the exact key always misses
      # and every job saves a fresh entry into GitHub's 10 GB LRU cache quota.
      # At ccache's 5 GB default a single slot can evict the rest, and the
      # restore-keys fallbacks the keys above rely on then miss silently.
      # Cap every slot so the whole run's set fits the quota.
      CCACHE_MAXSIZE: &ccache_maxsize 400M
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - &llvm_apt
        name: Add the apt.llvm.org repository
        # clang-22 is newer than the default LLVM on Ubuntu 24.04, so the
        # toolchain comes from apt.llvm.org rather than the distro archive.
        # Every job that installs clang aliases this step, so the repository and
        # the release channel are named once.
        # The signing key is checksum-pinned (tools/build_pins.py), like the
        # doxygen tarball in docs.yml: it is served by the same host as the
        # packages it authenticates, so a fresh fetch trusted on sight lets that
        # host vouch for itself. The deb transport stays plain HTTP — signed-by
        # is what authenticates the archive, and apt verifies it per release
        # file. Re-pin the digest if LLVM re-exports the key.
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm-snapshot.gpg.key
          echo '8b2a587ffd672c4687e7581dad4b2f6c1bb2ad6b480cd9771ba2ff48e0b8c75d  /tmp/llvm-snapshot.gpg.key' \
            | sha256sum --check --strict
          sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg /tmp/llvm-snapshot.gpg.key
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update

      - name: Install Clang + Ninja + ccache
        run: |
          # Pin the compiler version so the native suite — including the
          # __attribute__ / __builtin_trap death-harness semantics — runs on a
          # known compiler rather than whatever the rolling 'clang' metapackage
          # resolves to.
          sudo apt-get install -y clang-22 ninja-build ccache
          # cmake is preinstalled on GitHub runners (>= 3.29 required).

      # The generated-artifact gates (unit_color_luts, unit_color_luts_check,
      # unit_gamut_lut) need python3 + numpy. Provision them on every shard and
      # configure with -DHS_REQUIRE_GENERATORS=ON below: this is the one job
      # where those three CTests are required to RUN, so a provisioning break
      # fails the job instead of silently downgrading them to skips.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6        # pin the interpreter, like the provenance jobs
        with:
          python-version: '3.12'

      - name: Install numpy
        run: pip install --require-hashes -r requirements/numpy.txt

      # Each shard gets its own ccache slot so parallel saves don't collide.
      # The shard-agnostic restore-key means any prior shard's warm cache is
      # accepted on a cache miss (all shards compile the same TUs).
      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-tests-${{ github.run_id }}-${{ matrix.shard }}
          restore-keys: ccache-tests-

      # Pass the versioned compiler explicitly so the build is reproducible; the
      # 'tests' toolchain respects a pre-set CMAKE_CXX_COMPILER and skips its
      # EMSDK/PATH auto-detection. Don't auto-touch git config in CI.
      - name: Configure
        run: >
          cmake --preset tests -DHS_INSTALL_GIT_HOOKS=OFF -DHS_REQUIRE_GENERATORS=ON
          -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22

      - name: Build
        run: cmake --build --preset tests

      # EXCLUDE_FROM_ALL targets — perf_bench_Os because its wall-time run is too
      # noisy to gate as a ctest, the generators because running them rewrites a
      # committed header — are outside the default build, so an API rename can
      # ride green everywhere while silently breaking their sources. Compile them
      # here (build-only, once on shard 1). `excluded_targets` aggregates them in
      # tests/CMakeLists.txt off the buildsystem's own EXCLUDE_FROM_ALL property,
      # so a newly excluded target is covered without a workflow edit.
      - name: Build EXCLUDE_FROM_ALL targets (compile coverage only)
        if: matrix.shard == 1
        run: cmake --build --preset tests --target excluded_targets

      # Reverse-direction roster guard: every module in the
      # run_tests roster must map to a unit_<name> CTest registration, else it
      # runs in no ctest test and is silently uncovered. (The forward direction
      # already fails — an unknown argv module exits run_tests with status 2.)
      # Runs once, on shard 1, against the binary just built above.
      - name: Assert run_tests roster is registered in CTest
        if: matrix.shard == 1
        # An explicit `shell: bash` is what enables pipefail — GitHub's implicit
        # shell is `bash -e {0}`, under which sort's status 0 masks a crashed
        # lister and the empty roster below passes the check vacuously.
        shell: bash
        run: |
          roster=$(build/tests/tests/run_tests --list | sed -n 's/^  //p' | sort)
          if [ -z "$roster" ]; then
            echo "::error::'run_tests --list' produced no modules — output format changed?"
            exit 1
          fi
          registered=$(ctest --preset tests -N \
            | sed -n 's/.*[[:space:]]unit_\([A-Za-z0-9_]*\)$/\1/p' | sort)
          missing=$(comm -23 <(printf '%s\n' "$roster") <(printf '%s\n' "$registered"))
          if [ -n "$missing" ]; then
            echo "::error::run_tests modules with no CTest registration (add them to _hs_test_modules in tests/CMakeLists.txt): $missing"
            exit 1
          fi
          echo "All run_tests roster modules are registered in CTest."

      # Surface the cache hit rate so the ccache wiring above is verified to
      # actually fire, not just assumed. A run showing zero hits means the
      # compiler-launcher integration regressed and the cache is dead weight.
      - name: ccache stats
        if: always()
        run: ccache -sv

      - name: Test
        id: native_tests
        # Drive the deep smoke pass (default is 8 frames — fast for the local
        # pre-commit hook, but too short to reach the effect-lifecycle
        # transitions: RingShower slot reuse, Thrusters fire/FIFO expiry,
        # ShapeShifter's 48-frame cut). CI runs long enough to cover them so a
        # regression in the slot-recycling defect class fails here, not on-device.
        # The unit_arena_budget / unit_stack_budget gates resolve the same window
        # (tests/test_fixture.h smoke_frames()), so they score the high-water mark
        # over the frames the correctness sweep covers, not an 8-frame prefix.
        #
        # These Debug shards use the QUICK effects tier. The optimized master
        # shard is the authoritative production-resolution correctness leg.
        #
        # --no-tests=error: a shard regex that matches nothing is a shard-matrix
        # bug; without it an empty shard runs zero tests and reports green.
        #
        # HS_BUFFER_FREE_WATCHDOG_US: the canvas ctor's spin watchdog is a trap,
        # so a runner deschedule past it kills the shard instead of failing a
        # test. Shards 3 and 4 carry unit_canvas / unit_pov_segmented, the two
        # modules that spin it; 30 s still catches a genuinely stalled hand-off.
        #
        # HS_REQUIRE_EFFECTS_FULL rides alongside HS_EFFECTS_FULL: run_tests
        # rejects an effects run under CI unless both keys carry an explicit
        # value, so a step that drops the pair fails instead of falling back to
        # the quick tier. 0 here declares that this job may run QUICK.
        #
        # Every other job running the deep pass aliases these values instead of
        # re-typing them, so one left behind cannot narrow that job's window.
        # The values are aliased one by one rather than the whole mapping:
        # workflow YAML has no merge key, and two of those jobs add a
        # variable of their own.
        env:
          HS_SMOKE_FRAMES: &deep_smoke_frames 120
          HS_EFFECTS_FULL: &quick_effects 0
          HS_REQUIRE_EFFECTS_FULL: &effects_full_optional 0
          HS_SKIPS_ARE_ERRORS: ${{ matrix.skips_are_errors }}
          HS_BUFFER_FREE_WATCHDOG_US: &deep_smoke_watchdog 30000000
        run: >
          ctest --preset tests --output-on-failure --no-tests=error
          -R "${{ matrix.test_regex }}"

      - name: Detect MindSplatter replay corpus mismatch
        id: mindsplatter_corpus_mismatch
        if: ${{ always() && matrix.shard == 2 && steps.native_tests.outcome == 'failure' }}
        shell: bash
        run: |
          generated=build/tests/tests/mindsplatter_replay_corpus.generated.h
          committed=tests/mindsplatter_replay_corpus.h
          if [[ -f "$generated" ]] && ! cmp -s "$committed" "$generated"; then
            echo "mismatch=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload mismatched MindSplatter replay corpus
        if: ${{ always() && steps.mindsplatter_corpus_mismatch.outputs.mismatch == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mindsplatter-replay-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/tests/tests/mindsplatter_replay_corpus.generated.h
          if-no-files-found: error
          retention-days: 3

  sanitizers:
    name: Native unit tests (Clang, ASan + UBSan) / shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        # Same shard partition as the tests job — referenced by anchor, not
        # re-typed, so the jobs cannot drift.
        include: *shard_matrix
    # The native suite is the only build where the arena guards compile in
    # (device/WASM strip them), so ASan+UBSan here is the sole automated cover
    # for the arena-lifetime UB the death harness can't reach. -DHS_SANITIZE=ON
    # is wired in tests/CMakeLists.txt: ASan + UBSan with -fno-sanitize-recover,
    # so the first error is a hard failure. ccache absorbs the recompile cost.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: *ccache_maxsize
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - *llvm_apt

      - name: Install Clang + Ninja + ccache
        run: |
          # Same pinned clang-22 as the plain tests job (see its note).
          sudo apt-get install -y clang-22 ninja-build ccache

      # Separate cache prefix from the non-sanitized job (ASan/UBSan flags
      # change the compile command, so object caches must not collide).
      # Per-shard slot for the same reason as the tests job above.
      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-sanitizers-${{ github.run_id }}-${{ matrix.shard }}
          restore-keys: ccache-sanitizers-

      - name: Configure
        run: >
          cmake --preset tests -DHS_INSTALL_GIT_HOOKS=OFF -DHS_SANITIZE=ON
          -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22

      - name: Build
        run: cmake --build --preset tests

      - name: ccache stats
        if: always()
        run: ccache -sv

      - name: Test
        # Deep smoke pass (see the plain tests job) so the sanitized run reaches
        # the same effect-lifecycle transitions and exercises arena lifetimes.
        # The sanitizer leg keeps the QUICK effects tier; full-resolution
        # correctness runs once on master instead of multiplying its cost.
        #
        # -E drops the generated-artifact gates: they instrument no sanitized
        # code, and the Python gates cannot run because this job provisions
        # neither python3 nor numpy. The plain tests job runs them with
        # -DHS_REQUIRE_GENERATORS=ON. matrix.test_exclude is the
        # *generated_exclude anchor
        # each shard entry already carries, so the set cannot drift from the one
        # the matrix declares. Shard membership is untouched, so the
        # shard-coverage job still asserts every registered test is claimed by
        # exactly one shard. --no-tests=error for the same reason as the tests
        # job; every shard keeps tests outside the -E set.
        #
        # HS_BUFFER_FREE_WATCHDOG_US: the canvas ctor's spin watchdog is a trap,
        # so a runner deschedule past it kills the shard instead of failing a
        # test. ASan+UBSan cost the slowest module 2.7x (tests/CMakeLists.txt),
        # which makes that reachable at the 2 s default on a 2-vCPU runner; 30 s
        # still catches a genuinely stalled hand-off.
        env:
          HS_SMOKE_FRAMES: *deep_smoke_frames
          HS_EFFECTS_FULL: *quick_effects
          HS_REQUIRE_EFFECTS_FULL: *effects_full_optional
          HS_SKIPS_ARE_ERRORS: ${{ matrix.skips_are_errors }}
          HS_BUFFER_FREE_WATCHDOG_US: *deep_smoke_watchdog
        run: >
          ctest --preset tests --output-on-failure --no-tests=error
          -R "${{ matrix.test_regex }}"
          -E "${{ matrix.test_exclude }}"

  thread-sanitizer:
    name: Native unit tests (Clang, TSan) / concurrency modules
    # The canvas and pov_segmented modules are the suite's only genuine
    # concurrency: a render thread and a display-ISR stand-in trade the Effect
    # double buffer across the cur/next/prev handoff (core/render/canvas.h), with
    # the frame pixels themselves passed as plain memory. Every other job runs
    # them on x86-64, whose strong model masks a broken hand-off; the defect
    # would first appear in the Cortex-M display ISR, where there is no debugger.
    # TSan cannot share a binary with ASan, so this is its own job rather than a
    # flavour of the sanitizers matrix, and it builds only run_tests and runs
    # only those two modules — no other module spawns a thread.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: *ccache_maxsize
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - *llvm_apt

      - name: Install Clang + Ninja + ccache
        run: |
          # Same pinned clang-22 as the plain tests job (see its note).
          sudo apt-get install -y clang-22 ninja-build ccache

      # Own cache prefix: -fsanitize=thread changes the compile command, so this
      # object cache must not collide with the other jobs'.
      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-tsan-${{ github.run_id }}
          restore-keys: ccache-tsan-

      - name: Configure
        run: >
          cmake --preset tests -DHS_INSTALL_GIT_HOOKS=OFF -DHS_TSAN=ON
          -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22

      - name: Build
        run: cmake --build --preset tests --target run_tests

      - name: ccache stats
        if: always()
        run: ccache -sv

      - name: Test
        # Deep smoke window like the other jobs, so the segmented handoff walks
        # its full flip cycle. halt_on_error=1 makes the first race fatal, the
        # fail-fast counterpart of the sanitizers job's -fno-sanitize-recover.
        # --no-tests=error: a rename that empties this regex is a wiring bug, not
        # a green run.
        # HS_BUFFER_FREE_WATCHDOG_US: the canvas ctor's spin watchdog is a trap,
        # so a runner deschedule past it kills the shard instead of failing a
        # test. TSan's slowdown on a 2-vCPU runner makes that reachable at the
        # 2 s default; 30 s still catches a genuinely stalled hand-off.
        env:
          HS_SMOKE_FRAMES: *deep_smoke_frames
          HS_SKIPS_ARE_ERRORS: &skips_forbidden 1
          HS_BUFFER_FREE_WATCHDOG_US: *deep_smoke_watchdog
          TSAN_OPTIONS: halt_on_error=1
        run: >
          ctest --preset tests --output-on-failure --no-tests=error
          -R "^unit_(canvas|pov_segmented)$"

  optimized-tests:
    name: Native unit tests (Clang, optimized) / shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        # Same shard partition as the tests job — the entries are anchor
        # references, not re-typed, so the partition cannot drift. YAML cannot
        # append to an aliased sequence, hence the per-entry aliases rather than
        # *shard_matrix.
        # The fifth entry is the float-configuration axis, not a fifth shard:
        # it compiles the whole suite with the flag pair both shipping targets
        # use (platformio.ini, CMakeLists.txt) and runs compatible tests in one
        # job, so the axis costs one runner instead of four.
        include:
          - *shard1_entry
          - *shard2_entry
          - *shard3_entry
          - *shard4_entry
          - shard: fastmath
            test_regex: "."
            effects_full: 1
            optimization: -Os -g
            # These modules contain IEEE-sensitive reference or assertion-count
            # checks. The exclusions are anchored, so unit_effects_smoke — the
            # roster-wide smoke, cross-run determinism and clip-clear parity
            # sweeps, every assertion of which compares two renders from the
            # same binary — runs here even though unit_effects does not. That is
            # the whole effect roster's cover under the flag pair both shipping
            # targets build with.
            # unit_mindsplatter is the MindSplatter white-box block split
            # out of unit_effects; its framebuffer parities and geometry
            # replay are the IEEE-sensitive checks, so it is excluded on the
            # same grounds.
            # unit_shapeshifter_tiles is the mirror case: a mosaic of clipped
            # renders equals the unclipped frame only under IEEE, so it is split
            # out of unit_shapeshifter_oracle and only the split-off module is
            # excluded; the oracle's visual budgets run here.
            # unit_shader_chain asserts the interpreter's type-erased dispatch is
            # bit-identical to the same stage bound as a template. The two are
            # separate instantiations optimised in their own contexts, so
            # reassociation moves one and not the other and the identity is not
            # claimable under this flag pair; sharing an always_inline helper does
            # not restore it. Dispatch correctness is covered by shard 4, which
            # runs this module at -O2 under IEEE.
            # unit_pullback_capture_determinism selects the native-debug oracle;
            # the Debug and optimized IEEE jobs cover that configuration.
            test_exclude: "^unit_(3dmath|sdf|effects|mindsplatter|shapeshifter_tiles|conway_continuity|partition_seam|mesh|shader_chain|shader_workbench|pullback_capture_determinism|pov_sync|color_luts|color_luts_check|gamut_lut)$"
            float_flags: -ffast-math -fno-finite-math-only -DHS_TEST_FAST_MATH=1
            # The one leg that legitimately skips: the specialized HyperLattice
            # signature has no band sized for a reassociated Newton reciprocal.
            skips_are_errors: 0
    # The `tests` preset pins Debug, and the jobs above all reuse it, so every
    # assertion in the suite runs at -O0: UB the optimizer acts on, and FP
    # results that move under -O2 contraction, are structurally invisible there.
    # This job runs the SAME shards at -O2. CMAKE_CXX_FLAGS_RELWITHDEBINFO is
    # overridden to a plain "-O2 -g" so NDEBUG stays undefined — assert() and
    # the memory.h arena guards remain live, leaving the optimization level as
    # the only variable against the Debug jobs.
    # Both shipping targets build with -ffast-math -fno-finite-math-only
    # (platformio.ini, CMakeLists.txt); the fastmath entry is the leg that
    # asserts the suite under that pair, so the configuration the device and the
    # browser actually run is the one CI checks. relax_bake_verify pins itself
    # back to IEEE — see tests/CMakeLists.txt.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: *ccache_maxsize
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - *llvm_apt

      - name: Install Clang + Ninja + ccache
        run: |
          # Same pinned clang-22 as the plain tests job (see its note).
          sudo apt-get install -y clang-22 ninja-build ccache

      # Separate cache prefix from the Debug jobs: the opt flags change the
      # compile command, so the object caches must not collide. Per-shard slot
      # for the same reason as the tests job above. The restore-key carries the
      # shard: the fastmath entry compiles every TU differently from the four
      # IEEE shards, and "ccache-optimized-fastmath-" cannot prefix-match a
      # numbered shard's key (nor the reverse), so the two float configurations
      # never restore each other's objects.
      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-optimized-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: ccache-optimized-${{ matrix.shard }}-

      # float_flags is empty for the four shard entries, leaving them at the
      # plain "-O2 -g" this job has always used.
      - name: Configure
        run: >
          cmake --preset tests -DHS_INSTALL_GIT_HOOKS=OFF
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=${{ matrix.optimization || '-O2 -g' }} ${{ matrix.float_flags }}"
          -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22

      - name: Build
        run: cmake --build --preset tests

      - name: ccache stats
        if: always()
        run: ccache -sv

      - name: Test
        # On master, shard 3 is the full IEEE effects correctness leg and the
        # fastmath entry covers the shipping float configuration. Pull requests
        # use the quick tier; master catches production-resolution regressions.
        # --no-tests=error for the same reason as the tests job.
        # HS_BUFFER_FREE_WATCHDOG_US for the same reason as the tests job: shards
        # 3, 4 and fastmath all run unit_canvas / unit_pov_segmented.
        # HS_REQUIRE_EFFECTS_FULL does not read matrix.effects_full: an entry that
        # loses the key must fail the leg, not downgrade it to the quick tier.
        env:
          HS_SMOKE_FRAMES: *deep_smoke_frames
          HS_EFFECTS_FULL: ${{ github.event_name != 'pull_request' && matrix.effects_full || 0 }}
          HS_REQUIRE_EFFECTS_FULL: ${{ github.event_name != 'pull_request' && 1 || 0 }}
          HS_SKIPS_ARE_ERRORS: ${{ matrix.skips_are_errors }}
          HS_BUFFER_FREE_WATCHDOG_US: *deep_smoke_watchdog
        run: >
          ctest --preset tests --output-on-failure --no-tests=error
          -R "${{ matrix.test_regex }}"
          -E "${{ matrix.test_exclude }}"

  code-coverage:
    name: Native unit tests (Clang) / coverage
    # Required source-based coverage run. It fails on a broken build or failing
    # suite, retains an HTML/LCOV report and rejects catastrophic erosion below
    # a deliberately loose line floor. The current baseline is about 78%.
    # -DHS_COVERAGE=ON (tests/CMakeLists.txt) instruments run_tests only, and the
    # gating jobs above stay uninstrumented.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: *ccache_maxsize
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - *llvm_apt

      - name: Install Clang + LLVM + Ninja + ccache
        run: |
          # llvm-22 supplies llvm-profdata-22 / llvm-cov-22; the profile format is
          # version-locked to the compiler, so both must be the same major.
          sudo apt-get install -y clang-22 llvm-22 ninja-build ccache

      # Separate cache prefix: the coverage flags change the compile command, so
      # this object cache must not collide with the other jobs'.
      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-coverage-${{ github.run_id }}
          restore-keys: ccache-coverage-

      - name: Configure
        run: >
          cmake --preset tests -DHS_INSTALL_GIT_HOOKS=OFF -DHS_COVERAGE=ON
          -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22

      - name: Build
        run: cmake --build --preset tests --target run_tests

      - name: Run the instrumented suite
        # No argv = every module in one process, so a single profile covers the
        # whole roster. The stable QUICK tier keeps reports comparable across
        # pull requests and master while the separate master leg covers FULL.
        # %p keeps the death harness's re-spawned children off the parent's file.
        # HS_BUFFER_FREE_WATCHDOG_US for the same reason as the tests job, with
        # the whole roster instrumented on a 2-vCPU runner.
        env:
          HS_SMOKE_FRAMES: *deep_smoke_frames
          HS_EFFECTS_FULL: *quick_effects
          HS_REQUIRE_EFFECTS_FULL: *effects_full_optional
          HS_SKIPS_ARE_ERRORS: *skips_forbidden
          HS_BUFFER_FREE_WATCHDOG_US: *deep_smoke_watchdog
          LLVM_PROFILE_FILE: ${{ github.workspace }}/cov/run_tests-%p.profraw
        run: build/tests/tests/run_tests

      - name: Build coverage reports and enforce the floors
        # An explicit `shell: bash` is what enables pipefail — GitHub's implicit
        # shell is `bash -e {0}`, under which tee's status 0 masks a failed
        # llvm-cov and an empty code fence is published instead.
        # A repo-wide aggregate holds while a whole subsystem falls to zero, so
        # the largest core/ subtrees carry their own floors, derived from the
        # measured coverage. A directory the report names no file under fails
        # rather than passing vacuously.
        shell: bash
        run: |
          llvm-profdata-22 merge -sparse -o cov/run_tests.profdata cov/*.profraw
          llvm-cov-22 export build/tests/tests/run_tests \
            -instr-profile=cov/run_tests.profdata \
            -ignore-filename-regex='(^/usr/|/tests/)' \
            -summary-only > cov/summary.json
          llvm-cov-22 export build/tests/tests/run_tests \
            -instr-profile=cov/run_tests.profdata \
            -ignore-filename-regex='(^/usr/|/tests/)' \
            -format=lcov > cov/coverage.lcov
          llvm-cov-22 show build/tests/tests/run_tests \
            -instr-profile=cov/run_tests.profdata \
            -ignore-filename-regex='(^/usr/|/tests/)' \
            -format=html -output-dir=cov/html
          python tools/check_coverage.py cov/summary.json --min-lines 70 \
            --min-directory core/animation=90 \
            --min-directory core/color=85 \
            --min-directory core/math=95 \
            --min-directory core/mesh=80 \
            --min-directory core/render=90
          {
            echo '## Native suite coverage'
            echo
            echo '```'
            llvm-cov-22 report build/tests/tests/run_tests \
              -instr-profile=cov/run_tests.profdata \
              -ignore-filename-regex='(^/usr/|/tests/)'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-coverage
          path: |
            cov/coverage.lcov
            cov/summary.json
            cov/html
          if-no-files-found: error
          retention-days: 30

  windows-tests:
    name: Native unit tests (Windows / Clang)
    if: github.event_name != 'pull_request'
    # The native toolchain file's most intricate logic — the lld-link multicall
    # alias, CMAKE_LINKER_TYPE LLD, and the Windows SDK rc.exe discovery — only
    # runs on Windows and was previously exercised on no CI runner at all, on the
    # very platform the project is developed on. This job configures the tests
    # preset from a plain shell (no Visual Studio Developer Prompt), which is the
    # "no VS prompt required" promise the README makes.
    # Explicit label (not windows-latest) so a new Windows Server release cannot
    # silently re-host the job. The label selects an image family, not a fixed
    # image: the Windows SDK set behind the rc.exe glob still rolls with GitHub's
    # image updates.
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Load build pins
        id: pins
        run: python tools/build_pins.py --github-output

      # emsdk ships the Clang the toolchain prefers AND the lld.exe it aliases to
      # lld-link.exe — using it (rather than the runner's preinstalled LLVM)
      # exercises the alias-copy block, not just the linker-type/rc.exe paths.
      # Same pinned action + version as the wasm job.
      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ steps.pins.outputs.emsdk }}
          actions-cache-folder: emsdk-cache-${{ steps.pins.outputs.emsdk }}

      # No explicit compiler: let the toolchain auto-locate emsdk's Clang and run
      # its full Windows branch (lld-link alias, rc.exe glob/NATURAL-sort).
      - name: Configure
        run: cmake --preset tests -DHS_INSTALL_GIT_HOOKS=OFF

      - name: Build
        run: cmake --build --preset tests

      - name: Build EXCLUDE_FROM_ALL targets (compile coverage only)
        run: cmake --build --preset tests --target excluded_targets

      - name: Test
        # Deep smoke pass (see the Linux job): cover effect-lifecycle
        # transitions the default 8-frame local run never reaches.
        # Windows keeps the QUICK effects tier; this job targets toolchain
        # portability rather than duplicating the master-only FULL leg.
        # --no-tests=error: bare ctest exits 0 on an empty test list, and a
        # configure-time regression in the toolchain file's Windows branch —
        # what this job exists to cover — is exactly what would empty it.
        #
        # -E drops the generated-artifact gates for the same reason the sanitizer
        # job does: this runner uses a different compiler and provisions no
        # numpy. Excluding them makes that a declared gap rather than a silent
        # one. TEST_EXCLUDE is the
        # *generated_exclude anchor the shard matrix already carries, so the set
        # cannot drift from the one the matrix declares.
        #
        # HS_BUFFER_FREE_WATCHDOG_US for the same reason as the Linux tests job:
        # this job runs unit_canvas and unit_pov_segmented unsharded.
        env:
          HS_SMOKE_FRAMES: *deep_smoke_frames
          HS_EFFECTS_FULL: *quick_effects
          HS_REQUIRE_EFFECTS_FULL: *effects_full_optional
          # Declared gap: whether the emsdk image puts an interpreter on PATH
          # decides HS_HAVE_PULLBACK_MANIFEST, and with it three ShaderWorkbench
          # skips. The Linux jobs hold that line.
          HS_SKIPS_ARE_ERRORS: 0
          HS_BUFFER_FREE_WATCHDOG_US: *deep_smoke_watchdog
          TEST_EXCLUDE: *generated_exclude
        run: >
          ctest --preset tests --output-on-failure --no-tests=error
          -E "${{ env.TEST_EXCLUDE }}"

      # _hs_sanitize()'s WIN32 branch (UBSan in trap mode, because emsdk clang
      # ships no ASan runtime for the MSVC target) is reachable from no other
      # job: the sanitizers job is Linux and only ever takes the ASan branch. A
      # second build dir instruments one CTest-registered target rather than the
      # whole suite — enough to compile the trap flags and the
      # -fsanitize-ignorelist path, and to run instrumented vendored
      # FastNoiseLite code, at a fraction of a second sanitized suite build.
      - name: Configure + build the UBSan-trap flavour
        run: |
          cmake --preset tests -B build/tests-ubsan -DHS_INSTALL_GIT_HOOKS=OFF -DHS_SANITIZE=ON
          cmake --build build/tests-ubsan --target mindsplatter_replay

      - name: Test the UBSan-trap build
        run: >
          ctest --test-dir build/tests-ubsan --output-on-failure
          --no-tests=error -R unit_mindsplatter_replay

  wasm:
    name: WASM build (Emscripten)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: *ccache_maxsize
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Load build pins
        id: pins
        run: python tools/build_pins.py --github-output

      # The runtime smoke test instantiates the ES-module glue, so the Node that
      # runs it is part of the shipped contract — pin it rather than inheriting
      # whatever the runner image carries.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.pins.outputs.node }}

      - name: Install Ninja + ccache
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache

      # Pinned to match the local toolchain. Bump deliberately.
      # actions-cache-folder persists the emsdk install across runs. This is the
      # one third-party action and it provisions the toolchain, so it is pinned
      # to a full commit SHA (not a mutable tag) to prevent a retagged v16 from
      # silently swapping the compiler.
      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ steps.pins.outputs.emsdk }}
          actions-cache-folder: emsdk-cache-${{ steps.pins.outputs.emsdk }}

      # ccache also fronts emcc (CMAKE_CXX_COMPILER_LAUNCHER applies to both
      # modes), so cache it here too.
      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-wasm-${{ github.run_id }}
          restore-keys: ccache-wasm-

      # Zero only the statistics counters (not the cached objects, so hits still
      # work) so the ccache-stats gate below measures THIS run's compilations,
      # not the cumulative counts restored from a prior run.
      - name: Zero ccache stats
        run: ccache -z

      - name: Configure + build WASM (compile check)
        # The build is teed for the warning gate below (2>&1: em++ warnings are on
        # stderr). An explicit `shell: bash` is what enables pipefail — GitHub's
        # implicit shell is `bash -e {0}`, under which tee's status 0 masks a
        # failed build.
        shell: bash
        run: |
          # Create a throwaway daydream checkout so the install() rules are active
          # (DAYDREAM_DIR is resolved at configure time and must already exist).
          # This lets the job exercise the provenance/install path below. The
          # install refuses a destination without daydream.js, the marker that
          # tells a daydream checkout from a mistyped path, so plant one.
          mkdir -p "${{ runner.temp }}/daydream-install"
          touch "${{ runner.temp }}/daydream-install/daydream.js"
          mkdir -p "${{ runner.temp }}/daydream-install/docs/screenshots"
          touch "${{ runner.temp }}/daydream-install/docs/screenshots/stale.png"
          touch "${{ runner.temp }}/daydream-install/docs/screenshots/unrelated.txt"
          cmake --preset wasm-release -DDAYDREAM_DIR="${{ runner.temp }}/daydream-install"
          cmake --build --preset wasm-release 2>&1 | tee build/wasm-release-build.log

      - name: Configure + build WASM debug (compile check)
        # The wasm-debug preset (Debug: 64 KB stack, -sASSERTIONS=1) ships no
        # runtime consumer, so without this it can bit-rot — an assertion or a
        # debug-only branch that stops compiling would ride a green release build.
        # Compile-only (no run); reuses the emsdk + ccache provisioned above.
        # HS_WASM_DEV_BINDINGS=ON rides this build so the dev-only bindings
        # (MeshOps::getMaxBounds) compile somewhere; no other preset enables them.
        # `shell: bash` for pipefail, as above.
        shell: bash
        run: |
          cmake --preset wasm-debug -DDAYDREAM_DIR="${{ runner.temp }}/daydream-install" \
            -DHS_WASM_DEV_BINDINGS=ON
          cmake --build --preset wasm-debug 2>&1 | tee build/wasm-debug-build.log

      - name: Configure + build WASM strict-FP (compile check)
        # The wasm-strict-fp preset (PullbackStrictFP: -O3 -fno-fast-math
        # -ffp-contract=off, no LTO) is the configuration tools/pullback_capture.py
        # and tools/pullback_crosscheck.py build their WASM capture backend under,
        # and its build type reshapes the shipping holosphere_wasm target too. No
        # job runs either tool, so without this the whole configuration bit-rots.
        # Compile-only (no run); reuses the emsdk + ccache provisioned above.
        # `shell: bash` for pipefail, as above.
        shell: bash
        run: |
          cmake --preset wasm-strict-fp -DDAYDREAM_DIR="${{ runner.temp }}/daydream-install"
          cmake --build --preset wasm-strict-fp 2>&1 | tee build/wasm-strict-fp-build.log

      - name: First-party WASM warning gate
        # The WASM target compiles -Wall -Wextra but not -Werror: emscripten's
        # system headers ride that compile line (CMakeLists.txt). Enforcement is
        # here instead — fail on any warning whose file sits under a first-party
        # directory, the same split the firmware ratchet uses
        # (tools/teensy_warnings.py). A diagnostic raised in a sysroot header
        # names the sysroot path, which is what makes the path filter sufficient.
        # No baseline: this target's first-party warning set is empty, so the bar
        # is zero. All three configurations are checked — -O0 and -O3 diagnose
        # different things, fast-math and strict FP fold differently, and
        # HS_WASM_DEV_BINDINGS code compiles only in the debug build. ccache
        # replays a hit's stored stderr, so a warm cache still surfaces the
        # warnings.
        run: |
          logs=(build/wasm-release-build.log build/wasm-debug-build.log
                build/wasm-strict-fp-build.log)
          # A missing log makes grep exit 2, which reads as "no warnings" — assert
          # the captures exist rather than let a broken tee pass the gate.
          for log in "${logs[@]}"; do
            if [ ! -f "$log" ]; then
              echo "::error::$log missing — the warning capture broke, so the gate proves nothing"
              exit 1
            fi
          done
          if grep -nE '(^|[[:space:]/])(core|effects|workbench|hardware|targets)/[^:[:space:]]+:[0-9]+:([0-9]+:)?[[:space:]]*warning:' "${logs[@]}"; then
            echo "::error::first-party warning(s) in the WASM build — fix them (this target has no baseline)"
            exit 1
          fi
          echo "No first-party warnings in the release or debug WASM build."

      - name: Runtime-smoke WASM debug
        # The debug build carries -sASSERTIONS=1 and a distinct 64 KB stack;
        # instantiate and drive it so an assertion-guarded or debug-only
        # regression fails here instead of riding a green compile-only build.
        # -O0 disables inlining and stack-slot coalescing, so debug frames run
        # severalfold larger than the -O3 frames the default 2 KB stack-creep
        # tripwire is calibrated for; give the debug smoke its own 6 KB ceiling.
        env:
          WASM_SMOKE_STACK_CEILING: 6144
        run: node scripts/wasm_smoke.mjs build/wasm-debug/holosphere_wasm.js

      # Verify ccache actually fronts em++ here (the comment above claims it
      # does via CMAKE_CXX_COMPILER_LAUNCHER). Stats were zeroed before the
      # builds, so a nonzero cacheable-call count (hits + misses) proves ccache
      # saw the em++ compilations this run; zero means the emcc launcher
      # integration silently disengaged and the cache is dead weight. Fail loudly
      # rather than leaving the documented check to eyeballing.
      - name: ccache stats
        if: always()
        run: |
          ccache -sv
          stat() { ccache --print-stats | awk -F'\t' -v k="$1" '$1==k{v=$2} END{print v+0}'; }
          calls=$(( $(stat direct_cache_hit) + $(stat preprocessed_cache_hit) + $(stat cache_miss) ))
          echo "Cacheable em++ calls this run: $calls"
          if [ "$calls" -eq 0 ]; then
            echo "::error::ccache recorded zero cacheable calls — the em++ launcher integration is not engaging."
            exit 1
          fi

      - name: Smoke-test the WASM module at runtime
        # The build above only proves the module compiles and links. Instantiate
        # it the way the browser does and drive the engine across every
        # registered effect at every enumerated resolution, so a SIMD-codegen fault, an
        # embind signature mismatch, an 8 KB stack overflow, or an
        # ALLOW_MEMORY_GROWTH detachment regression fails here instead of riding
        # a green build to deploy. (The script has no dependencies; Node is
        # pinned above.) The frame depth is the script's own default, so
        # `just smoke` drives the same run this does.
        run: node scripts/wasm_smoke.mjs build/wasm-release/holosphere_wasm.js

      - name: Exercise install + provenance path
        # The daydream deploy gate consumes the provenance set (.wasm, .js, .sha,
        # .wasm.sha256, .toolchain) this install writes, but nothing previously
        # verified the install rules actually produce them. Run the install target
        # and assert every installed artifact exists and the recorded hashes
        # verify (the same sha256 check the gate runs) so a broken provenance step
        # fails here, not at deploy. The file list is every install() rule in
        # CMakeLists.txt; the gallery is a directory install, checked below.
        run: |
          cmake --build --preset wasm-release-install
          dd="${{ runner.temp }}/daydream-install"
          for f in holosphere_wasm.wasm holosphere_wasm.js holosphere_wasm.sha holosphere_wasm.wasm.sha256 holosphere_wasm.toolchain pov_segment_map.json; do
            if [ ! -f "$dd/$f" ]; then
              echo "::error::install did not produce $f — a consumer in the daydream checkout depends on it"
              exit 1
            fi
          done
          if [ ! -f "$dd/README.md" ]; then
            echo "::error::install did not produce README.md"
            exit 1
          fi
          if ! cmp -s README.md "$dd/README.md"; then
            echo "::error::installed README.md differs from the engine source"
            exit 1
          fi
          if [ -e "$dd/docs/screenshots/stale.png" ]; then
            echo "::error::install retained a stale mirrored screenshot"
            exit 1
          fi
          if [ ! -e "$dd/docs/screenshots/unrelated.txt" ]; then
            echo "::error::install removed unrelated screenshot-directory content"
            exit 1
          fi
          diff -u \
            <(cd docs/screenshots && find . -type f -name '*.png' | sort) \
            <(cd "$dd/docs/screenshots" && find . -type f -name '*.png' | sort)
          # The runtime smokes above drive the BUILD tree's glue. The install
          # rewrites it through file(CONFIGURE ... @ONLY) and then hashes its own
          # output, so a botched rewrite ships glue whose recorded hash agrees
          # with it. Instantiate the installed pair — the bytes the deploy gate
          # verifies and the browser loads.
          node scripts/wasm_smoke.mjs "$dd/holosphere_wasm.js"
          # A clean CI checkout must record a bare 40-hex SHA (no -dirty marker).
          if grep -q -- '-dirty' "$dd/holosphere_wasm.sha"; then
            echo "::error::engine .sha recorded as -dirty on a clean CI checkout"
            cat "$dd/holosphere_wasm.sha"
            exit 1
          fi
          ( cd "$dd" && sha256sum -c holosphere_wasm.wasm.sha256 )
          # The toolchain marker must name the emsdk that actually built the
          # artifacts, otherwise it records nothing the source-pin doesn't already
          # cover. Compared against the provisioned emcc rather than the pinned
          # version literal above, so bumping the pin needs no second edit here.
          recorded="$(awk '$1 == "emsdk" { print $2 }' "$dd/holosphere_wasm.toolchain")"
          built_with="$("$EMSDK/upstream/emscripten/emcc" -dumpversion)"
          if [ "$recorded" != "$built_with" ]; then
            echo "::error::holosphere_wasm.toolchain records emsdk '$recorded', but this job built with $built_with"
            cat "$dd/holosphere_wasm.toolchain"
            exit 1
          fi
          # The marker also records the configuration, which the emsdk line does
          # not distinguish: this install is the wasm-release preset with the dev
          # bindings off — the shape the deploy gate requires of a shipped module.
          field() { awk -v k="$1" '$1 == k { print $2 }' "$dd/holosphere_wasm.toolchain"; }
          if [ "$(field build_type)" != "Release" ] || [ "$(field dev_bindings)" != "OFF" ]; then
            echo "::error::holosphere_wasm.toolchain records build_type '$(field build_type)' / dev_bindings '$(field dev_bindings)'; the release install must record Release / OFF"
            cat "$dd/holosphere_wasm.toolchain"
            exit 1
          fi
          echo "Provenance set produced, artifact hashes verified, toolchain recorded:"
          cat "$dd/holosphere_wasm.toolchain"
          bundle="${{ runner.temp }}/holosphere-engine"
          mkdir "$bundle"
          cp "$dd"/holosphere_wasm.{js,wasm,sha,wasm.sha256,toolchain} \
            "$dd/pov_segment_map.json" "$bundle/"
          cp -r "$dd/shader" "$bundle/"
          cp "$dd/README.md" "$bundle/"
          mkdir -p "$bundle/docs/screenshots"
          (
            cd "$dd/docs/screenshots"
            find . -type f -name '*.png' -exec \
              cp --parents '{}' "$bundle/docs/screenshots"/ \;
          )
          (
            cd "$bundle"
            # The manifest is excluded from the walk, so it is written but never
            # read by the same pipeline.
            # shellcheck disable=SC2094
            find . -type f ! -name holosphere_engine.sha256 -print0 \
              | sort -z \
              | xargs -0 sha256sum > holosphere_engine.sha256
            sha256sum -c holosphere_engine.sha256
          )

      - name: Upload verified engine bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: holosphere-engine-${{ github.sha }}
          path: ${{ runner.temp }}/holosphere-engine
          if-no-files-found: error

  daydream-consumer:
    name: Simulator suite runs against this engine
    needs: wasm
    # The engine installs seven kinds of file into a daydream checkout
    # (CMakeLists.txt's DAYDREAM_DIR rules) and nothing here ever ran the
    # consumer's own suite: a shader-workbench, segment-map or promoted-document
    # change lands green in this repository and surfaces as a red run in the
    # other one once its engine pin moves. This job closes that direction by
    # driving daydream's tests over the verified bundle the wasm job published.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Load build pins
        id: pins
        run: python tools/build_pins.py --github-output

      # Pinned for the same reason as the tree-fence checkouts: daydream's tip
      # moves independently, so an unpinned consumer would red an unrelated
      # engine change and flip a re-run of an unchanged commit.
      - name: Check out the pinned daydream consumer
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: woundedlion/daydream
          ref: ${{ steps.pins.outputs.daydream }}
          path: daydream
          persist-credentials: false
          fetch-depth: 0

      # The engine's node pin, not daydream's: it is the newer of the two and
      # satisfies the floor daydream's package.json declares.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.pins.outputs.node }}
          cache: npm
          cache-dependency-path: daydream/package-lock.json

      - name: Download the verified engine bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: holosphere-engine-${{ github.sha }}
          path: engine-bundle

      - name: Install the bundle over the daydream checkout
        # The bundle's own manifest is the install set, so a file added to the
        # DAYDREAM_DIR rules reaches the consumer with no second edit here.
        run: |
          ( cd engine-bundle && sha256sum -c holosphere_engine.sha256 )
          while read -r _ path; do
            path="${path#\*}"
            path="${path#./}"
            mkdir -p "daydream/$(dirname "$path")"
            cp "engine-bundle/$path" "daydream/$path"
          done < engine-bundle/holosphere_engine.sha256
          ( cd daydream && sha256sum -c holosphere_wasm.wasm.sha256 )

      - name: Run the simulator suite against this engine
        # HOLOSPHERE_ENGINE_DIR names this checkout, and _REQUIRED turns the
        # cross-repo comparisons from skip-when-absent into hard failures: those
        # tests read engine HEAD directly (git show), so they measure the commit
        # under test rather than the bundle alone.
        working-directory: daydream
        env:
          HOLOSPHERE_ENGINE_DIR: ${{ github.workspace }}
          HOLOSPHERE_ENGINE_REQUIRED: '1'
        run: |
          npm ci
          npm test

  lut-provenance:
    name: Generated LUTs match committed header
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6        # pin the interpreter, like the teensy jobs
        with:
          python-version: '3.12'

      - name: Install clang-format
        run: pip install --require-hashes -r requirements/clang-format.txt

      - name: Regenerate LUTs and diff the full header
        # core/color/color_luts.h is generated by scripts/generate_luts.py, which
        # pipes its own output through clang-format. Diff the FULL text, so array
        # names, the flash-section marker, the include and the line endings gate
        # alongside the numbers — the double-precision math makes silent numeric
        # drift plausible, and a hand-edited declaration is just as much a
        # divergence.
        # The committed file is normalized through the same clang-format binary
        # first, so the runner's clang-format version can only reflow both sides
        # identically and never turns layout into a false failure. clang-format
        # must exist: without it the generator emits an unformatted fallback.
        # Installed from the exact pip pin the clang-format job uses, so both
        # gates reflow with one binary: whatever the runner image carries would
        # re-flow the whole file the day it moves its default LLVM, which would
        # rewrite the committed header.
        # CLANG_FORMAT is the generator's own override (scripts/generate_luts.py);
        # bumping the pin means bumping EXPECTED_CLANG_FORMAT_MAJOR there too, which
        # is what warns a local run whose clang-format would reflow the header.
        env:
          CLANG_FORMAT: clang-format
        run: |
          "$CLANG_FORMAT" --version
          python3 scripts/generate_luts.py > /tmp/color_luts.generated.h
          "$CLANG_FORMAT" --assume-filename=core/color/color_luts.h \
            < core/color/color_luts.h > /tmp/color_luts.committed.h
          if ! diff -u /tmp/color_luts.committed.h /tmp/color_luts.generated.h \
                    > /tmp/color_luts.diff; then
            head -40 /tmp/color_luts.diff
            echo "::error::core/color/color_luts.h is out of sync with scripts/generate_luts.py"
            echo "Regenerate with: python scripts/generate_luts.py > core/color/color_luts.h"
            exit 1
          fi
          echo "Regenerated header matches core/color/color_luts.h in full."

      - name: Generator self-test (monotonicity + sRGB round-trip)
        run: python3 scripts/generate_luts.py --check

  reaction-graph-provenance:
    name: Generated reaction-graph table matches committed file
    runs-on: ubuntu-24.04
    # The generator is O(RD_N*W) with W=1000 and runs ~2+ min; bound the job so a
    # pathological RD_N/W change can't hang a runner indefinitely.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6        # pin the interpreter, like the teensy jobs
        with:
          python-version: '3.12'

      - name: Regenerate reaction-graph table and diff the full file
        # core/spatial/reaction_graph.cpp is the 92 KB Fibonacci-lattice K-NN table,
        # emitted by scripts/generate_reaction_graph.py (pure Python, no deps).
        # Diff the FULL text, like the color_luts and srgb_decode gates: the
        # banner, the array names and the declarations gate alongside the
        # neighbor indices, and the file is excluded from the clang-format job
        # (it is emitted, not hand-formatted) so nothing else reads them. The
        # generator LF-pins its stdout and reproduces the committed file
        # byte-for-byte, so any difference is a real divergence — a script edit,
        # a hand-edit of the table, or a node()-formula change.
        run: |
          python3 scripts/generate_reaction_graph.py > /tmp/reaction_graph.generated.cpp
          if ! diff -u core/spatial/reaction_graph.cpp \
                    /tmp/reaction_graph.generated.cpp > /tmp/reaction_graph.diff; then
            head -40 /tmp/reaction_graph.diff
            echo "::error::core/spatial/reaction_graph.cpp is out of sync with scripts/generate_reaction_graph.py"
            echo "Regenerate with: python scripts/generate_reaction_graph.py > core/spatial/reaction_graph.cpp"
            exit 1
          fi
          echo "Regenerated table matches core/spatial/reaction_graph.cpp in full."

  gamut-lut-provenance:
    name: Generated gamut LUT matches committed file
    runs-on: ubuntu-24.04
    # The generator solves ~8.4M first-exit rays and runs ~1-2 min; bound the job
    # so a resolution change can't hang a runner indefinitely.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6        # pin the interpreter, like the teensy jobs
        with:
          python-version: '3.12'

      - name: Install numpy
        run: pip install --require-hashes -r requirements/numpy.txt

      - name: Check gamut LUT provenance and the color.h/3dmath.h mirrors
        # ctest unit_gamut_lut runs the same --check inside the sharded unit-test
        # job (which provisions numpy and sets -DHS_REQUIRE_GENERATORS=ON, so it
        # cannot skip); this job runs it standalone, independent of that build.
        run: |
          bash tools/require_test_files.sh 'tools/gamut_lut_tests/test*.py'
          python3 -m unittest discover -s tools/gamut_lut_tests
          python3 tools/gen_gamut_lut.py --check

  srgb-decode-provenance:
    name: Generated sRGB decode tables match committed header
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - *llvm_apt

      - name: Install Clang + Ninja
        run: |
          sudo apt-get install -y clang-22 ninja-build   # pinned like the unit-test job

      # srgb_decode_gen is EXCLUDE_FROM_ALL and the sharded job only compiles it;
      # here it is actually run, to argv[1] rather than over the committed header.
      - name: Build the generator
        run: |
          cmake --preset tests -DHS_INSTALL_GIT_HOOKS=OFF \
            -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22
          cmake --build --preset tests --target srgb_decode_gen

      - name: Regenerate the decode tables and diff the full header
        # Diff the FULL text: the banner, the recorded bucket geometry, the
        # array names and the flash-section marker gate alongside the numbers. The
        # generator is deterministic integer work over linear_to_srgb_lut, so any
        # difference is a real divergence — a hand-edit of the table, a
        # bucket-geometry change, or a color_luts.h regeneration that moved a
        # step point.
        run: |
          ./build/tests/tests/srgb_decode_gen /tmp/srgb_decode_lut.generated.h
          if ! diff -u core/color/srgb_decode_lut.h \
                    /tmp/srgb_decode_lut.generated.h > /tmp/srgb_decode_lut.diff; then
            head -40 /tmp/srgb_decode_lut.diff
            echo "::error::core/color/srgb_decode_lut.h is out of sync with scripts/generate_srgb_decode.cpp"
            echo "Regenerate with: cmake --build --preset tests --target srgb_decode_gen && ./build/tests/tests/srgb_decode_gen"
            exit 1
          fi
          echo "Regenerated tables match core/color/srgb_decode_lut.h in full."

  patterns-provenance:
    name: Promoted shader documents match their generator
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Load build pins
        id: pins
        run: python tools/build_pins.py --github-output

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.pins.outputs.node }}

      # patterns/*.shader.json is compiled from the v1 specs in the generator and
      # installed into daydream, so a hand edit here is reverted by the next
      # regeneration. --check recompiles every spec and compares the committed
      # document, comparing LF content so a CRLF checkout does not red.
      # Documents in patterns/ that this generator does not emit are untouched.
      - name: Check promoted shader document provenance
        run: node scripts/generate_promoted_shader_documents.mjs --check

  scripts-unit-tests:
    name: scripts/*.test.mjs unit suite
    # The Node unit suite gates the shader-workbench schema and digest
    # contracts, the WASM smoke predicates, the engine bindings contract, the
    # profile roster and the PNG probe. It is its own job because ci-green
    # checks which jobs ran, not which steps they contained: as a step inside
    # another job, narrowing that job would drop the whole suite silently.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Load build pins
        id: pins
        run: python tools/build_pins.py --github-output

      # The suite has no runtime deps, so no `npm ci` is needed; the Node
      # running it is pinned like every other tool.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.pins.outputs.node }}

      # Discovered by glob, not enumerated, so a newly added scripts/*.test.mjs
      # runs here without a workflow edit; require_test_files.sh prevents an
      # empty match from being reported as green. Driven through
      # `npm test` so the package.json entry point is the gated command rather
      # than a second spelling of it. scripts/run_tests.mjs rejects any
      # discovered test file that executes no cases or no assertions; node
      # itself counts a file gutted to a comment as one pass.
      - name: Every scripts/*.test.mjs unit test runs
        run: |
          bash tools/require_test_files.sh 'scripts/*.test.mjs'
          npm test

  screenshot-gallery:
    name: Screenshot gallery is valid and covers every effect
    # The docs/screenshots gallery is installed into daydream and served live,
    # but a full headless re-capture per build is far too slow to gate on. This
    # job is the cheap freshness check instead: it (1) syntax-checks the capture
    # script — the browser-free decisions it makes are unit-tested by
    # scripts-unit-tests — (2) asserts the committed PNG
    # set matches the HS_EFFECT_LIST roster exactly (every effect has a PNG, no
    # orphans) — catching roster drift like an added/renamed effect whose
    # screenshot was never captured — and (3) validates each PNG datastream and
    # its stored dimensions, so a zero-byte or bit-rotted asset cannot ship.
    # KNOWN GAP: nothing here compares PNG pixels to what the effect renders, so
    # a visually-stale image still relies on a manual `npm run screenshots`
    # re-capture. Driving the real capture would need a Playwright browser and a
    # served daydream checkout per build.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Load build pins
        id: pins
        run: python tools/build_pins.py --github-output

      # The scripts have no runtime deps (the freshness gate never launches a
      # browser), but the Node running them is pinned like every other tool.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.pins.outputs.node }}

      - name: Syntax-check the capture script
        run: node --check scripts/capture_screenshots.mjs

      - name: Gallery covers every registered effect
        run: node scripts/check_screenshots.mjs

      - name: Profile archive covers every Phantasm effect
        run: node scripts/check_profiles.mjs

      # Cross-check the HS_EFFECT_LIST X-macro roster against the REGISTER_EFFECT
      # calls in effects/*.h. The WASM count check can't see an effect that is
      # never #included from core/engine/effects.h (absent from both registry and
      # count); scanning the headers on disk catches that roster drift.
      - name: Effect roster matches REGISTER_EFFECT registrations
        run: node scripts/check_effect_roster.mjs

  docs-images:
    name: Documented image references resolve
    # docs.yml stages these images into the Doxygen artifact, but that workflow
    # is path-filtered: moving or deleting an image outside docs/screenshots/
    # matches none of its paths, so the broken reference reaches no run there.
    # This job needs no Doxygen build — it resolves every `<img>` in the tracked
    # Markdown against the tracked tree, and ci.yml has no path filter.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Load build pins
        id: pins
        run: python tools/build_pins.py --github-output

      # The fence is exhaustive over the daydream tree, so the checkout tracks
      # the committed pin: daydream's tip moves independently and would red an
      # unrelated engine change and flip a re-run of an unchanged commit.
      - name: Check out daydream tree-fence target
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: woundedlion/daydream
          ref: ${{ steps.pins.outputs.daydream }}
          path: daydream
          persist-credentials: false
          fetch-depth: 0

      - name: Every documented image reference resolves
        run: python tools/docs_images.py

  docs-markdown:
    name: Tracked Markdown is valid
    # Lives here rather than in docs.yml because that workflow is path-filtered
    # to the Doxygen inputs (**.h, **.cpp, *.md, Doxyfile, justfile, the theme
    # files). A rename or deletion under scripts/, tools/, .github/ or
    # platformio.ini breaks a documented link and matches none of those filters,
    # so the checker never ran on the commit that broke it. ci.yml has no path
    # filter, so every run of this workflow gates it.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Load build pins
        id: pins
        run: python tools/build_pins.py --github-output

      # The fence is exhaustive over the daydream tree, so the checkout tracks
      # the committed pin: daydream's tip moves independently and would red an
      # unrelated engine change and flip a re-run of an unchanged commit.
      - name: Check out daydream tree-fence target
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: woundedlion/daydream
          ref: ${{ steps.pins.outputs.daydream }}
          path: daydream
          persist-credentials: false
          fetch-depth: 0

      # docs_check --checkout validates the daydream tree fence's rows, never
      # the README's bytes, and the wasm job's cmp targets a scratch install
      # written from this same file. Neither can see the committed mirror drift
      # from its source, so compare them directly. A README change lands in
      # daydream first, then the pin moves here -- the same order every other
      # mirrored artifact takes.
      - name: Engine README matches the daydream mirror
        run: |
          if ! cmp -s README.md daydream/README.md; then
            echo "::error::daydream's committed README.md has drifted from the engine source"
            diff -u README.md daydream/README.md | head -60
            exit 1
          fi

      # Discover finds test files by pattern, so one deleted or renamed out of
      # it can run no suite and stay green; require_test_files.sh fails instead.
      - name: Validate tracked Markdown
        run: |
          bash tools/require_test_files.sh 'tools/docs_check_tests/test*.py'
          bash tools/require_test_files.sh 'tools/docs_images_tests/test*.py'
          python -m unittest discover -s tools/docs_check_tests
          python -m unittest discover -s tools/docs_images_tests
          python tools/docs_check.py --checkout daydream=daydream
          python tools/build_pins.py --check

      # --check above prints PASS whether or not its three checks still parse the
      # shapes they read (workflow YAML, package.json's `>=X` range); these drive
      # each against a fixture that must fail.
      - name: Run build-pin gate self-tests
        run: |
          bash tools/require_test_files.sh 'tools/build_pins_tests/test*.py'
          python -m unittest discover -s tools/build_pins_tests -v

      # An ignore rule is inert against an already-tracked path, so .gitignore
      # alone cannot keep a session artifact out of the repo.
      - name: No tracked-but-ignored paths
        run: |
          tracked_ignored=$(git ls-files -i -c --exclude-standard)
          if [ -n "$tracked_ignored" ]; then
            echo "Tracked paths matched by .gitignore:" >&2
            echo "$tracked_ignored" >&2
            exit 1
          fi

  license-headers:
    name: License headers match LICENSE
    # LICENSE grants PolyForm outside effects/ and reserves all rights over it,
    # with a named exception list. Generators emit headers too, so without a
    # gate the two re-drift on every regeneration.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6        # pin the interpreter, like the docs job
        with:
          python-version: '3.12'

      # Discover finds test files by pattern, so one deleted or renamed out of
      # it can run no suite and stay green; require_test_files.sh fails instead.
      - name: Check tracked license headers
        run: |
          bash tools/require_test_files.sh 'tools/license_check_tests/test*.py'
          python -m unittest discover -s tools/license_check_tests
          python tools/license_check.py

  lint:
    name: Lint (Python + JavaScript + shell + justfile + workflows)
    # The C++ tree has clang-format and the firmware warning ratchet; the ~28k
    # lines of Python, ~7.4k of .mjs and the shell under scripts/, tools/,
    # .githooks/ and hardware/ -- which include the gate scripts every other job
    # depends on, and the hooks that enforce the landing model -- had no static
    # check at all. Both configs select defect rules only (ruff.toml,
    # eslint.config.mjs): no formatter runs and no stylistic rule is enabled, so
    # the gate reports real breakage rather than reflowing the tree.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Load build pins
        id: pins
        run: python tools/build_pins.py --github-output

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      # Pinned in tools/build_pins.py, which `just lint` also holds the local
      # binary to: ruff's rule set moves between releases, so an unpinned
      # invocation gates the tree on a different set than this job.
      - name: Install ruff
        run: pip install --require-hashes -r requirements/ruff.txt

      # Config in ruff.toml. Ruff honours .gitignore, so build trees are skipped
      # -- and an over-broad ignore or exclude would empty the target set while
      # `ruff check` still exits 0. --show-files is ruff's own discovery pass, so
      # the count below is exactly the set the check runs on; --statistics counts
      # violations instead and reads as empty on a clean tree.
      - name: Lint Python
        run: |
          ruff check --no-cache --show-files . > /tmp/ruff-files.txt
          if [ ! -s /tmp/ruff-files.txt ]; then
            echo "::error::no files selected — the ruff.toml exclude list or a .gitignore rule is broken"
            exit 1
          fi
          ruff check --no-cache --output-format=github .
          echo "ruff clean: $(wc -l < /tmp/ruff-files.txt) files linted."

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.pins.outputs.node }}

      # npm ci (not install) so the linter versions are the locked ones and the
      # gate cannot change under a transitive release.
      - name: Install Node dev dependencies
        run: npm ci --no-audit --no-fund

      # Config in eslint.config.mjs. Same hazard as the ruff step above: an
      # over-broad `ignores` empties the target set while `eslint .` still exits
      # 0, so count the files the run actually reported on. The second invocation
      # is the one whose output a failure is read from.
      - name: Lint JavaScript
        run: |
          npx eslint . --format json > /tmp/eslint-report.json || true
          count=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/eslint-report.json','utf8')).length")
          if [ "$count" -eq 0 ]; then
            echo "::error::no files selected — the eslint.config.mjs ignores list is broken"
            exit 1
          fi
          npx eslint .
          echo "eslint clean: $count files linted."

      # The justfile is the documented local entry point (README, CONTRIBUTING)
      # and no job ran it in any form, so a parse error or a broken variable
      # expression breaks every documented workflow behind a green run.
      # rust-just is the PyPI distribution of the same binary, pinned like ruff.
      - name: Install just
        run: pip install --require-hashes -r requirements/just.txt

      # --summary parses the whole file and lists the public recipes;
      # --evaluate additionally resolves every justfile-level variable, which is
      # where the interpreter probe and the daydream-checkout switch live. An
      # empty recipe list is a broken justfile that both still exit 0 on, so it
      # is counted, like the two lint steps above.
      - name: Parse the justfile
        run: |
          just --evaluate
          just --summary > /tmp/just-recipes.txt
          count=$(wc -w < /tmp/just-recipes.txt)
          if [ "$count" -eq 0 ]; then
            echo "::error::no recipes — the justfile parsed to nothing"
            exit 1
          fi
          echo "justfile clean: $count recipes."

      # shellcheck-py is the PyPI distribution of the same binary, pinned like
      # ruff: shellcheck's checks move between releases, so an unpinned one
      # gates the tree on a different set than this job.
      - name: Install shellcheck
        run: pip install --require-hashes -r requirements/shellcheck.txt

      # The pre-commit hook, the fast-forward-only reference-transaction hook
      # and the profile/device scripts are where the gate logic lives, and a
      # shellcheck-class defect there passes a gate silently rather than failing
      # it. The file list is enumerated from the index, so an empty one is a
      # broken gate, like the steps above.
      # No check is excluded tree-wide: -x follows the one sourced file through
      # its `shellcheck source=` directive, and the two variables read outside
      # the file that declares them carry their own disable.
      - name: Lint shell
        run: |
          mapfile -t FILES < <(git ls-files -- '*.sh' '.githooks/*')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::no files selected — the shell path list is broken"
            exit 1
          fi
          shellcheck -x "${FILES[@]}"
          echo "shellcheck clean: ${#FILES[@]} files linted."

      # actionlint-py is the PyPI distribution of the same binary, pinned like
      # ruff and shellcheck above.
      - name: Install actionlint
        run: pip install --require-hashes -r requirements/actionlint.txt

      # The workflows carry the shard bijection, the ci-green aggregation, the
      # install-provenance and coverage-floor gates as shell inside `run:`
      # blocks, which the shellcheck step above cannot reach: no workflow is a
      # tracked *.sh file. actionlint checks the workflow itself (expression
      # syntax, the `needs` graph, event and matrix keys) and pipes every
      # `run:` body through shellcheck.
      # The file list is enumerated from the index, so a new workflow is linted
      # with no edit here and an empty list is a broken path list.
      # actionlint drops its shellcheck integration silently when the binary is
      # not on PATH, which would leave every run body unchecked behind a green
      # step; -verbose reports the drop, so it is captured and made fatal.
      - name: Lint workflows
        run: |
          mapfile -t FILES < <(git ls-files -- '.github/workflows/*.yml')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::no files selected — the workflow path list is broken"
            exit 1
          fi
          actionlint -verbose -oneline "${FILES[@]}" 2> /tmp/actionlint-verbose.txt
          if grep -q 'Rule "shellcheck" was disabled' /tmp/actionlint-verbose.txt; then
            echo "::error::actionlint ran without shellcheck — the run: bodies went unchecked"
            exit 1
          fi
          echo "actionlint clean: ${#FILES[@]} workflows linted."

      # tools/profile_sweep.sh dispatches the on-device profiling groups, whose
      # per-effect knobs are hand-tuned and so cannot be generated from the
      # roster. An effect added to HS_PHANTASM_EFFECT_LIST with no group row
      # aborts all six groups, and the failure only surfaces at the next manual
      # sweep. `check` runs the script's own cross-check against that list and
      # needs no attached board.
      - name: Profile sweep groups cover the Phantasm playlist
        run: bash tools/profile_sweep.sh check

  shard-coverage:
    name: Shard coverage (tests and shard alternatives in bijection)
    # The tests/sanitizers jobs run subsets of the suite via the shard regexes.
    # A module registered in CMake but absent from every shard would run in no
    # Linux/sanitizer job and silently lose that coverage; an alternative naming no
    # test is dead weight the forward direction cannot see. Assert both directions
    # against the SAME anchored scalars the matrices use, so this check cannot
    # drift from them.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SHARD1: *shard1_re
      SHARD2: *shard2_re
      SHARD3: *shard3_re
      SHARD4: *shard4_re
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - *llvm_apt

      - name: Install Clang + Ninja
        run: |
          sudo apt-get install -y clang-22 ninja-build

      # Configure only — ctest -N reads the generated test list; no build needed.
      - name: Configure (register tests)
        run: >
          cmake --preset tests -DHS_INSTALL_GIT_HOOKS=OFF
          -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22

      - name: Assert the shard matrix and the registered tests are in bijection
        run: |
          # ctest right-aligns the index, so single-digit tests get extra spaces
          # ("Test  #1:" vs "Test #10:"); match one-or-more spaces around it.
          mapfile -t TESTS < <(ctest --preset tests -N \
            | sed -n 's/^[[:space:]]*Test[[:space:]]\+#[0-9]\+:[[:space:]]*//p')
          if [ "${#TESTS[@]}" -eq 0 ]; then
            echo "::error::no tests parsed from 'ctest -N' — output format changed?"
            exit 1
          fi
          fail=0
          for t in "${TESTS[@]}"; do
            n=0
            for re in "$SHARD1" "$SHARD2" "$SHARD3" "$SHARD4"; do
              if printf '%s\n' "$t" | grep -Eq "$re"; then n=$((n + 1)); fi
            done
            if [ "$n" -ne 1 ]; then
              echo "::error::test '$t' is in $n shards (want exactly 1) — update the shard matrix in ci.yml"
              fail=1
            fi
          done
          for re in "$SHARD1" "$SHARD2" "$SHARD3" "$SHARD4"; do
            alts=${re#"^unit_("}
            alts=${alts%")$"}
            if [ "$alts" = "$re" ]; then
              echo "::error::shard regex '$re' is not the ^unit_(a|b|...)\$ shape this check parses"
              fail=1
              continue
            fi
            IFS='|' read -r -a ALTS <<< "$alts"
            for a in "${ALTS[@]}"; do
              if ! printf '%s\n' "${TESTS[@]}" | grep -Fxq "unit_$a"; then
                echo "::error::shard alternative 'unit_$a' matches no registered test — drop it from the shard matrix in ci.yml"
                fail=1
              fi
            done
          done
          if [ "$fail" -eq 0 ]; then
            echo "All ${#TESTS[@]} registered tests are in exactly one shard, and every shard alternative names one."
          fi
          exit "$fail"

  domain-ratchets:
    name: Domain coverage ratchets (no silent weakening)
    # These counts represent concrete exercised behavior: relax-bake payloads
    # re-derived, and the engine guard sites each census file leaves unpinned.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # One pin name per line: MIN_RELAX_BAKES_VERIFIED or guard_gap.<file>.
      DOMAIN_RATCHET_ALLOW_WEAKEN: ""
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Assert no domain coverage ratchet weakened
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          PREV=
          if [ -n "$PUSH_BEFORE" ]; then
            PREV=$(git rev-parse --verify --quiet "$PUSH_BEFORE^{commit}") || PREV=
          fi
          if [ -z "$PREV" ] && ! PREV=$(git rev-parse --verify --quiet HEAD^1); then
            echo "::warning::HEAD has no reachable parent - domain ratchet check skipped"
            exit 0
          fi

          HARNESS=tools/relax_bake_harness.cpp
          DEATH=tests/test_death.h
          if ! git cat-file -e "$PREV:$HARNESS" 2>/dev/null; then
            echo "::error file=$HARNESS::$HARNESS is absent in $PREV - domain ratchet comparison unavailable"
            exit 1
          fi
          if ! git cat-file -e "$PREV:$DEATH" 2>/dev/null; then
            echo "::error file=$DEATH::$DEATH is absent in $PREV - domain ratchet comparison unavailable"
            exit 1
          fi
          git show "$PREV:$HARNESS" > /tmp/ratchet-prev-harness.cpp
          git show "$PREV:$DEATH" > /tmp/ratchet-prev-death.h
          python tools/check_domain_ratchets.py \
            /tmp/ratchet-prev-harness.cpp "$HARNESS" \
            /tmp/ratchet-prev-death.h "$DEATH" --previous-ref "$PREV"
  clang-format:
    name: Formatting (clang-format)
    # Cloud counterpart of the .githooks/pre-commit format check. The hook
    # refuses a missing or mismatched formatter, while CI disables local hooks
    # and checks the whole tree independently.
    # Same invocation as the hook (--dry-run --Werror --style=file) over the
    # same first-party C++ set, but across the whole tracked tree instead of one
    # commit's staged paths.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install clang-format
        run: pip install --require-hashes -r requirements/clang-format.txt

      - name: Check formatting
        env:
          CF: clang-format
        run: |
          "$CF" --version

          # Same file set as .githooks/pre-commit: first-party C++ only, with
          # core/vendor/ and the seven generated sources excluded (they are
          # emitted by their generators, not hand-formatted). The exclusion
          # regex is pinned against the hook's copy by
          # tools/build_pins.py --check (SHARED_LITERALS), so the two cannot
          # drift apart silently.
          git ls-files -- '*.h' '*.hpp' '*.cpp' '*.cc' '*.inl' \
            | grep -vE '(^|/)core/vendor/|(^|/)core/color/color_luts\.h$|(^|/)core/color/gamut_lut\.h$|(^|/)core/color/srgb_decode_lut\.h$|(^|/)core/color/triadic_palette_luts\.h$|(^|/)core/mesh/relax_bakes_generated\.h$|(^|/)core/spatial/reaction_graph\.cpp$|(^|/)tests/mindsplatter_replay_corpus\.h$' \
            > /tmp/format-files.txt

          if [ ! -s /tmp/format-files.txt ]; then
            echo "::error::no files selected — the pathspec or exclusion regex is broken"
            exit 1
          fi

          rc=0
          : > /tmp/format-unformatted.txt
          while IFS= read -r f; do
            if ! "$CF" --dry-run --Werror --style=file "$f" >/dev/null 2>&1; then
              printf '%s\n' "$f" >> /tmp/format-unformatted.txt
              "$CF" --style=file "$f" | diff -u "$f" - || true
            fi
          done < /tmp/format-files.txt
          if [ -s /tmp/format-unformatted.txt ]; then
            while IFS= read -r f; do
              echo "::error file=$f::not formatted per .clang-format (fix: clang-format -i $f)"
            done < /tmp/format-unformatted.txt
            rc=1
          fi

          if [ "$rc" -eq 0 ]; then
            echo "clang-format clean: $(wc -l < /tmp/format-files.txt) files gated."
          fi
          exit "$rc"

  teensy-gate-tests:
    name: Teensy gate parser + layout self-tests
    # The Teensy size/layout gate must gate itself: a check that can never fail
    # is worse than none. These host-Python tests prove every layout invariant
    # and region ceiling FAILS on a deliberately-broken fixture and PASSES on the
    # good one. No ARM toolchain, no
    # PlatformIO — fast, and independent of the heavy build job below, so it runs
    # on every run regardless of whether the firmware build is enabled yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      # A suite directory named nowhere has no discovery step and runs nowhere;
      # this cross-check ensures every tracked suite directory is wired here and
      # in the justfile, so the local and cloud runs cover one set.
      - name: Every test-suite directory is discovered
        run: bash tools/check_test_dir_pins.sh
      # Discover finds test files by pattern, so one deleted or renamed out of
      # it can run no suite and stay green; require_test_files.sh fails instead.
      - name: Run gate parser/layout/warning self-tests
        run: |
          bash tools/require_test_files.sh 'tools/teensy_gate_tests/test*.py'
          python -m unittest discover -s tools/teensy_gate_tests -v
      - name: Run coverage-gate self-tests
        run: |
          bash tools/require_test_files.sh 'tools/coverage_tests/test*.py'
          python -m unittest discover -s tools/coverage_tests -v
      - name: Run PlatformIO build-hook self-tests
        run: |
          bash tools/require_test_files.sh 'tools/teensy_hook_tests/test*.py'
          python -m unittest discover -s tools/teensy_hook_tests -v
      # The reference-transaction hook protects the local master ref, so it is
      # driven against a scratch repository here.
      - name: Run git hook self-tests
        run: |
          bash tools/require_test_files.sh 'tools/githook_tests/test*.py'
          python -m unittest discover -s tools/githook_tests -v
      - name: Run profiling tool self-tests
        run: |
          bash tools/require_test_files.sh 'tools/profile_tests/test*.py'
          python -m unittest discover -s tools/profile_tests -v
      - name: Run relax-bake generator self-tests
        run: |
          bash tools/require_test_files.sh 'tools/relax_bake_tests/test*.py'
          python -m unittest discover -s tools/relax_bake_tests -v
      - name: Run PCB generator self-tests + routed metadata check
        run: |
          bash tools/require_test_files.sh 'hardware/phantasm/gen/tests/test*.py'
          python -m unittest discover -s hardware/phantasm/gen/tests -v
          python hardware/phantasm/gen/board_metadata.py --check

  teensy-size:
    name: Teensy 4 firmware (build + size + layout)
    # ─── ACTIVE GATE ───────────────────────────────────────────────────────────
    # Builds both Teensy 4.0 images headlessly and enforces the per-region budgets
    # + layout invariants via the post-build extra_script. Both images
    # now build GREEN and PASS end-to-end on the real ELF: HOLOSPHERE fits with
    # wide headroom and PHANTASM (all effects) fits RAM1 after the ITCM-bank
    # reclamation, the RNG/cos_theta DTCM trims, and the arena right-size at
    # 298 KiB — free-for-locals 13,920 B over a measured 12 KiB floor, and ITCM
    # code 40 B under its bank-derived ceiling. Those margins are thin: a
    # re-measure belongs with every toolchain pin bump. The former
    # TEENSY_GATE_ENABLED repo-variable guard is removed now that it goes green.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6        # PlatformIO is a Python package
        with:
          python-version: '3.12'
      - name: Cache PlatformIO toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.platformio
          # Target-agnostic (one toolchain serves all environments). The exact key
          # rotates on any platformio.ini pin bump; restore-keys then seeds the
          # restore from the newest prior toolchain cache so a pin bump pays only
          # for the changed packages, not a full multi-hundred-MB re-download
          # (mirrors the build-objects cache below). This can't mask a pin change:
          # `pio run` installs exactly the versions platformio.ini pins on top of
          # whatever the restore seeded, and the new exact key re-saves the result.
          key: pio-teensy-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-teensy-
      - name: Cache build objects               # mirrors ci.yml's ccache discipline
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # build_cache_dir from platformio.ini — without this the 7,685-line
          # reaction_graph.cpp + FastLED recompile from scratch in every environment.
          path: .pio/build_cache
          # Rolling cache (like the toolchain cache above): the github.sha suffix
          # makes the exact key miss every run, so restore-keys seeds from the
          # newest prior cache and PlatformIO recompiles only what changed, then
          # this run saves a fresh entry. The per-commit save trades storage churn
          # for an always-warm incremental cache independent of branch topology.
          key: pio-objs-${{ hashFiles('platformio.ini') }}-${{ github.sha }}
          restore-keys: pio-objs-${{ hashFiles('platformio.ini') }}-
      - name: Install pinned PlatformIO
        run: pip install --require-hashes -r requirements/platformio.txt
      - name: Build + size + layout gate (shipping targets + compile profiles)
        # The extra_script (tools/teensy_gate_extra.py) enforces per-env budgets
        # and sets a non-zero exit on any violation, emitting ::error:: annotations.
        # holosphere_dma is an ungated compile+link drift check for pov_single.h's
        # USE_DMA_LEDS path, which no shipping image builds (see platformio.ini).
        # phantasm8 likewise compiles the optional eight-board firmware profile;
        # the mechanically qualified N=4 image remains the budgeted target.
        # profile/profile_o3 are ungated too: they build targets/Profile/Profile.ino
        # against the HS_PROFILE instrumentation API at both optimization levels,
        # which no shipping image compiles.
        run: >-
          pio run -e holosphere -e phantasm -e holosphere_dma -e phantasm8
          -e profile -e profile_o3
      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: teensy-firmware
          path: .pio/build/*/firmware.*
          if-no-files-found: warn

  teensy-warnings:
    name: Teensy 4 firmware (no first-party warnings)
    # The warning parser fails on any first-party warning. It needs a
    # COLD build: a cached/incremental TU emits no warnings, so the object-cached
    # teensy-size job above cannot feed it. This job is a separate build that does
    # not restore the build-objects cache and deletes any object cache before
    # building, so every first-party TU recompiles and emits its warnings.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6        # PlatformIO is a Python package
        with:
          python-version: '3.12'

      # Toolchain cache is safe to share with teensy-size (it only holds the
      # downloaded compiler/framework, not built objects). The build-objects
      # cache is deliberately NOT restored here.
      - name: Cache PlatformIO toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.platformio
          key: pio-teensy-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-teensy-
      - name: Install pinned PlatformIO
        run: pip install --require-hashes -r requirements/platformio.txt
      - name: Cold build + warning ratchet (all targets)
        # Deleting .pio/build_cache is what makes the build cold. PlatformIO keeps
        # both the object cache and the SCons signature database under
        # platformio.ini's build_cache_dir, and there is no env var that disables
        # it: PLATFORMIO_BUILD_CACHE_DIR is read through a truthiness test, so an
        # EMPTY value is ignored and build_cache_dir still wins. .pio/build goes
        # too, so no object is up to date either. Both are absent on a fresh
        # runner; the removal is what keeps the job cold if a build-objects cache
        # restore is ever added here.
        # -v echoes the compiler invocations; warnings go to stderr, so 2>&1 folds
        # them into the captured log. An explicit `shell: bash` is what enables
        # pipefail — GitHub's implicit shell is `bash -e {0}`, under which tee's
        # status 0 masks a failed build.
        # No -e: every environment platformio.ini declares gets warning coverage,
        # including profile/profile_o3, the only builds that compile
        # targets/Profile/Profile.ino and the HS_PROFILE paths in shared render
        # code. The ratchet expects exactly that same set (platformio.ini has no
        # default_envs), so an environment that never runs fails the job.
        # The ratchet re-checks coldness from the log, so a cache reaching this
        # build fails the job instead of silently shrinking the warning surface.
        shell: bash
        run: |
          rm -rf .pio/build_cache .pio/build
          pio run -v 2>&1 | tee teensy_build.log
          python tools/teensy_warnings.py --build-log teensy_build.log --github

  docs-doxygen:
    name: Doxygen build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - uses: ./.github/actions/pinned-doxygen

      - name: Generate docs
        run: mkdir -p build/docs && doxygen Doxyfile

  ci-green:
    name: CI green
    # The one status branch protection keys on, so a required check covers every
    # job here instead of a hand-maintained list that a newly added job silently
    # escapes. `needs` names every other job in this file; the drift check below
    # fails when one is missing.
    # `if: always()` is load-bearing: a failed dependency SKIPS a plain job, and
    # a skipped required check does not block a merge.
    # Only `success` counts below except for the explicitly allowlisted jobs
    # whose own conditions skip them outside their supported event or platform.
    needs:
      - tests
      - sanitizers
      - thread-sanitizer
      - optimized-tests
      - code-coverage
      - windows-tests
      - wasm
      - daydream-consumer
      - lut-provenance
      - reaction-graph-provenance
      - gamut-lut-provenance
      - srgb-decode-provenance
      - patterns-provenance
      - scripts-unit-tests
      - screenshot-gallery
      - docs-images
      - docs-markdown
      - docs-doxygen
      - license-headers
      - lint
      - shard-coverage
      - domain-ratchets
      - clang-format
      - teensy-gate-tests
      - teensy-size
      - teensy-warnings
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Assert every job is a dependency and succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          # Space-separated jobs allowed to report `skipped` on pull requests.
          ALLOW_SKIPPED: 'windows-tests'
        run: |
          WF=.github/workflows/ci.yml

          # Top-level job keys: the two-space-indented `key:` lines after `jobs:`.
          # Everything inside a job (including block-scalar bodies) is indented
          # deeper, and the `on:` keys sit above `jobs:`.
          awk '
            /^jobs:[[:space:]]*$/ { injobs = 1; next }
            injobs && /^[^[:space:]]/ { injobs = 0 }
            injobs && /^  [A-Za-z0-9_-]+:[[:space:]]*$/ {
              sub(/^  /, ""); sub(/:[[:space:]]*$/, ""); print
            }
          ' "$WF" | grep -vx ci-green | sort > /tmp/ci-jobs.txt
          # An empty extraction would make the comparison below pass vacuously.
          [ -s /tmp/ci-jobs.txt ] || {
            echo "::error file=$WF::no top-level job keys parsed, so the needs check proves nothing"
            exit 1
          }

          # One "<job> <result>" pair per line. Written to a file rather than
          # read through a pipeline or process substitution so a failure to
          # decode the results fails the step instead of reading as "no failures".
          python3 - <<'PY' > /tmp/ci-results.txt
          import json, os
          for job, meta in sorted(json.loads(os.environ["RESULTS"]).items()):
              print(job, meta["result"])
          PY
          cut -d" " -f1 /tmp/ci-results.txt | sort > /tmp/ci-needs.txt

          missing=$(comm -23 /tmp/ci-jobs.txt /tmp/ci-needs.txt)
          if [ -n "$missing" ]; then
            for j in $missing; do
              echo "::error file=$WF::job '$j' is absent from ci-green's needs, so the aggregate status would go green without it"
            done
            exit 1
          fi

          awk -v allow="$ALLOW_SKIPPED" -v event="$EVENT" '
            BEGIN {
              n = split(allow, entries, " ")
              for (i = 1; i <= n; i++) allowed[entries[i]] = 1
            }
            $2 == "success" { next }
            $2 == "skipped" && event == "pull_request" && allowed[$1] { next }
            { print }
          ' /tmp/ci-results.txt > /tmp/ci-bad.txt
          if [ -s /tmp/ci-bad.txt ]; then
            while read -r job result; do
              if [ "$result" = skipped ]; then
                echo "::error file=$WF::job '$job' was skipped, so its checks did not run; list it in ALLOW_SKIPPED if that is intended"
              else
                echo "::error::job '$job' did not pass: $result"
              fi
            done < /tmp/ci-bad.txt
            exit 1
          fi
          echo "CI green: $(wc -l < /tmp/ci-results.txt) jobs, every one success."
