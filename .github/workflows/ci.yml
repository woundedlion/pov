      - name: Load build pins
        id: pins
        run: python tools/build_pins.py --github-output

      - name: Install CMake for cache-key integration tests
        run: pip install --require-hashes -r requirements/cmake.txt

      # The suite uses no npm dependencies.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}

      # The runner rejects empty file selections, cases, and assertion counts.
      - name: Every scripts/*.test.mjs unit test runs
        run: |
          bash tools/require_test_files.sh 'scripts/*.test.mjs'
          npm test

  screenshot-gallery:
    name: Screenshot gallery, profile archive and effect roster
    # Checks gallery membership and PNG integrity; pixel freshness requires recapture.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
