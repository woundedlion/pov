  lint:
    name: Lint (Python + JavaScript + shell + justfile + workflows)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Load build pins
        id: pins
        run: python tools/build_pins.py --github-output

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}

      - name: Install lint tools
        run: |
          pip install --require-hashes -r requirements/ruff.txt -r requirements/just.txt -r requirements/shellcheck.txt
          npm ci --no-audit --no-fund

      - name: Install actionlint
        run: |
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin"
          tar -xzf actionlint.tar.gz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"


      - name: Lint
        run: just lint

