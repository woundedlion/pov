  teensy-size:
    name: Teensy 4 firmware (build + size + layout)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0  # PlatformIO is a Python package
        with:
          python-version: '3.12'
      - name: Cache PlatformIO toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-teensy-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-teensy-
      - name: Cache build objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pio/build_cache
          key: pio-objs-${{ hashFiles('platformio.ini') }}-${{ github.sha }}
          restore-keys: pio-objs-${{ hashFiles('platformio.ini') }}-
      - name: Install pinned PlatformIO
        run: pip install --require-hashes -r requirements/platformio.txt
      - name: Build + size + layout gate (shipping targets + compile profiles)
        # Shipping environments enforce budgets; other environments provide compile coverage.
        run: python tools/teensy_size_table.py
      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: teensy-firmware
          path: .pio/build/*/firmware.*
          if-no-files-found: warn

  teensy-warnings:
    name: Teensy 4 firmware (no first-party warnings)
    # Warning coverage requires a cold build of every first-party translation unit.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0  # PlatformIO is a Python package
        with:
          python-version: '3.12'

      - name: Cache PlatformIO toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-teensy-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-teensy-
      - name: Install pinned PlatformIO
        run: pip install --require-hashes -r requirements/platformio.txt
      - name: Cold build + warning ratchet (all targets)
        # An empty PLATFORMIO_BUILD_CACHE_DIR is ignored; remove both cache and build outputs.
        shell: bash
        run: |
          bash tools/teensy_cold_build.sh teensy_build.log
          python tools/teensy_warnings.py --build-log teensy_build.log --github

  docs-doxygen:
    name: Doxygen build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: ./.github/actions/pinned-doxygen

      - name: Generate docs
        run: mkdir -p build/docs && doxygen Doxyfile

  ci-green:
    name: CI green
    # Branch protection requires ci-green; always() prevents failed dependencies from skipping it.
    needs:
      - tests
      - sanitizers
      - thread-sanitizer
      - optimized-tests
      - code-coverage
      - windows-tests
      - wasm
      - lut-provenance
      - reaction-graph-provenance
      - gamut-lut-provenance
      - srgb-decode-provenance
      - patterns-provenance
      - scripts-unit-tests
      - screenshot-gallery
      - docs-images
      - docs-markdown
      - docs-doxygen
      - license-headers
      - lint
      - clang-format
      - teensy-gate-tests
      - teensy-size
      - teensy-warnings
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert every job is a dependency and succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          WF=.github/workflows/ci.yml

          # Job keys are the two-space-indented keys after jobs:.
          awk '
            /^jobs:[[:space:]]*(#.*)?$/ { injobs = 1; next }
            injobs && /^[^[:space:]]/ { injobs = 0 }
            injobs && /^  [A-Za-z0-9_-]+:[[:space:]]*(#.*)?$/ {
              sub(/^  /, ""); sub(/:[[:space:]]*(#.*)?$/, ""); print
            }
          ' "$WF" | grep -vx ci-green | sort > /tmp/ci-jobs.txt
          # An empty extraction would make the comparison below pass vacuously.
          [ -s /tmp/ci-jobs.txt ] || {
            echo "::error file=$WF::no top-level job keys parsed, so the needs check proves nothing"
            exit 1
          }

          python3 - <<'PY' > /tmp/ci-results.txt
          import json, os
          for job, meta in sorted(json.loads(os.environ["RESULTS"]).items()):
              print(job, meta["result"])
          PY
          cut -d" " -f1 /tmp/ci-results.txt | sort > /tmp/ci-needs.txt

          missing=$(comm -23 /tmp/ci-jobs.txt /tmp/ci-needs.txt)
          if [ -n "$missing" ]; then
            for j in $missing; do
              echo "::error file=$WF::job '$j' is absent from ci-green's needs, so the aggregate status would go green without it"
            done
            exit 1
          fi

          awk '$2 != "success" { print }' /tmp/ci-results.txt > /tmp/ci-bad.txt
          if [ -s /tmp/ci-bad.txt ]; then
            while read -r job result; do
              if [ "$result" = skipped ]; then
                echo "::error file=$WF::job '$job' was skipped, so its checks did not run"
              else
                echo "::error::job '$job' did not pass: $result"
              fi
            done < /tmp/ci-bad.txt
            exit 1
          fi
          echo "CI green: $(wc -l < /tmp/ci-results.txt) jobs, every one success."
