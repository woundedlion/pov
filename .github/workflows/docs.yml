# Build and publish API-reference changes on master; validate matching pull requests.
name: Docs

on:
  push:
    branches: [master]
    paths: &docs_paths
      - '**.h'
      - '**.cpp'
      - '**.ino'
      - '*.md'
      - '**/*.md'
      - 'Doxyfile'
      - 'docs/doxygen-custom.css'
      - 'docs/doxygen-theme.cfg'
      - 'docs/screenshots/**'
      - 'tools/build_pins.py'
      - 'tools/docs_check.py'
      - 'tools/docs_sync.py'
      - 'tools/docs_images.py'
      - 'justfile'
      - '.github/actions/pinned-doxygen/action.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths: *docs_paths

permissions:
  contents: read

jobs:
  build:
    name: Build Doxygen HTML
    permissions:
      contents: read
    concurrency:
      group: docs-build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Load build pins
        id: pins
        run: python tools/build_pins.py --github-output

      - name: Check out daydream tree-fence target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: woundedlion/daydream
          ref: ${{ steps.pins.outputs.daydream }}
          path: daydream
          persist-credentials: false
          fetch-depth: 0

      - name: Validate tracked Markdown
        run: python tools/docs_check.py --checkout daydream=daydream

      - uses: ./.github/actions/pinned-doxygen

      - name: Generate docs
        run: mkdir -p build/docs && doxygen Doxyfile

      - name: Stage README images and resolve every reference
        run: python tools/docs_images.py --stage

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/docs/html

  deploy:
    name: Deploy to Pages
    needs: build
    if: github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
