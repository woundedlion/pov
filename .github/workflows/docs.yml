# Builds the Doxygen API reference and publishes it to GitHub Pages on every
# push to master. Pages serves the result at https://woundedlion.github.io/pov/.
# Independent of ci.yml: docs deploy on their own and do not gate the test
# matrix (nor does this wait on it). Doxygen config lives in /Doxyfile.
name: Docs

on:
  push:
    branches: [master]
    # Run for API-reference inputs and every Markdown change. The build job
    # validates the Markdown it is about to publish, but this filter means a
    # rename outside these paths reaches no run here; ci.yml runs the same
    # Markdown and image checkers unfiltered, so a documented link or image
    # reference cannot break unnoticed.
    paths:
      - '**.h'
      - '**.cpp'
      - '**.ino'
      - '*.md'
      - '**/*.md'
      - 'Doxyfile'
      - 'docs/doxygen-custom.css'
      - 'docs/doxygen-theme.cfg'
      - 'docs/screenshots/**'
      - 'tools/build_pins.py'
      - 'tools/docs_check.py'
      - 'tools/docs_images.py'
      - 'justfile'
      - '.github/workflows/docs.yml'
  # Build-only presubmit on PRs touching the same inputs. The deploy job is
  # push-gated, so PRs build without deploying.
  pull_request:
    paths:
      - '**.h'
      - '**.cpp'
      - '**.ino'
      - '*.md'
      - '**/*.md'
      - 'Doxyfile'
      - 'docs/doxygen-custom.css'
      - 'docs/doxygen-theme.cfg'
      - 'docs/screenshots/**'
      - 'tools/build_pins.py'
      - 'tools/docs_check.py'
      - 'tools/docs_images.py'
      - 'justfile'
      - '.github/workflows/docs.yml'

# Default every job to source read-only. Deploy grants its publish capabilities.
# The build job's checkout passes persist-credentials: false, as ci.yml's do;
# deploy takes the artifact and never checks out, so it needs no source token.
permissions:
  contents: read

jobs:
  build:
    name: Build Doxygen HTML
    permissions:
      contents: read
    # Per-ref slot so a PR build never occupies the Pages deploy group. PR
    # rebuilds supersede themselves; master builds queue rather than cancel so
    # every deployable commit produces an artifact.
    concurrency:
      group: docs-build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # Pinned image (not ubuntu-latest) so the doxygen/graphviz versions are
    # deterministic, matching the rest of CI.
    runs-on: ubuntu-24.04
    # Bound the job so a stalled tarball download or a doxygen/graphviz hang
    # can't hold a runner to the 6h default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # build_pins.py selects the theme commit this job publishes, and
      # docs_images.py resolves the artifact's images. Pin their interpreter as
      # the ci.yml jobs do rather than taking the image's default python.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      # The Markdown this job is about to publish is validated before it is
      # served: a broken link or a stale repository-map fence would otherwise
      # deploy from a commit whose ci.yml docs-markdown job is red, and `deploy`
      # needs this job. No --checkout: the `tree daydream` fence is drawn from a
      # sibling repository whose HEAD moves independently, and blocking a docs
      # deploy on that would couple this workflow to another repo's churn.
      # ci.yml gates that fence unfiltered.
      - name: Validate tracked Markdown
        run: python tools/docs_check.py

      # Pin Doxygen to an exact release binary (apt's version trails and lacks
      # newer config tags this Doxyfile uses). Graphviz comes from the pinned
      # image. This matches the version used to validate the docs locally.
      - name: Install Doxygen 1.17.0 (pinned) + Graphviz
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz
          curl -fsSL https://github.com/doxygen/doxygen/releases/download/Release_1_17_0/doxygen-1.17.0.linux.bin.tar.gz -o doxygen.tar.gz
          echo '75419ef4f446fc1c24ef12514b574e66e898ee6f527c6ae2ad84f91a905823c2  doxygen.tar.gz' | sha256sum --check --strict
          tar xzf doxygen.tar.gz
          echo "$PWD/doxygen-1.17.0/bin" >> "$GITHUB_PATH"

      # Modern theme (third-party). Pinned to an exact commit (v2.3.4) rather
      # than the mutable tag so a retagged release can't swap the theme CSS under
      # this write/OIDC-scoped deploy. Drop this step for stock Doxygen styling.
      - name: Apply doxygen-awesome theme
        run: |
          theme_sha="$(python tools/build_pins.py doxygen-awesome)"
          git init -q .doxygen-awesome
          git -C .doxygen-awesome remote add origin https://github.com/jothepro/doxygen-awesome-css.git
          git -C .doxygen-awesome fetch -q --depth 1 origin "$theme_sha"
          git -C .doxygen-awesome checkout -q FETCH_HEAD
          cat docs/doxygen-theme.cfg >> Doxyfile

      - name: Generate docs
        run: mkdir -p build/docs && doxygen Doxyfile

      # Doxygen copies neither the README's screenshot gallery nor any other
      # repo-relative image into its output, so the published pages reference
      # files the artifact does not carry. Stage them and fail on any <img>
      # reference the artifact still cannot resolve.
      - name: Stage README images and resolve every reference
        run: python tools/docs_images.py --stage

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/docs/html

  deploy:
    name: Deploy to Pages
    needs: build
    if: github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    # One Pages deploy at a time; never cancel an in-flight deploy mid-publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
