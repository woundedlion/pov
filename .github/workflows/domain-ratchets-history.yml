# Whole-history re-check of the domain coverage ratchets. The ci.yml job walks
# only the edges one push introduced, so a weakening that slips a push is never
# examined again; this walks every gated edge in the repository instead.
name: Domain ratchet history

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

# The checkout below also passes persist-credentials: false; nothing here
# pushes, calls gh, or reads GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  domain-ratchets-history:
    name: Domain coverage ratchets (whole history)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Assert no domain coverage ratchet weakened anywhere in history
        run: |
          ROOT=$(git rev-list --max-parents=0 --first-parent HEAD | tail -n 1)
          if [ -z "$ROOT" ]; then
            echo "::error::no root commit found - the history scan proves nothing"
            exit 1
          fi
          python tools/check_domain_ratchets.py --git-range "$ROOT" HEAD
