; ============================================================================
; Teensy 4 firmware builds and the size/layout gate.
;
; Builds the budgeted shipping images plus the compile and profiling profiles
; (`just teensy-size` locally). tools/teensy_gate_extra.py enforces the
; per-region budgets and layout invariants in tools/teensy_budgets.json.
;
; VMicro owns __vm/ and *.vcxproj; this file owns .pio/ (gitignored). Both
; compile the same sources in place.
; ============================================================================

[platformio]
; PlatformIO finds the sketch only via $PROJECT_SRC_DIR/*.ino and ignores
; build_src_filter, so tools/teensy_pre.py repoints the sketch dir per env.
src_dir = .
; Object cache and SCons signature database (gitignored, CI-cached). A cached
; TU emits no warnings, so tools/teensy_cold_build.sh deletes it before the
; warning gate.
build_cache_dir = .pio/build_cache

[env]
; teensy@5.2.0 ships Teensyduino 1.62.0 and PJRC's arm-none-eabi-gcc 15.2.1
; fork, the bench toolchain. The platform declares both as `~` ranges;
; platform_packages pins the exact versions. Bump them with the platform and
; re-measure the budgets.
platform = teensy@5.2.0
platform_packages =
    platformio/toolchain-gccarmnoneeabi-teensy@1.150201.0
    platformio/framework-arduinoteensy@1.162.0
framework = arduino
board_build.f_cpu = 600000000L   ; 600 MHz

; Keeps the Library Dependency Finder out of targets/wasm/ and build*/.
lib_ldf_mode = chain

; pre:  select the sketch, then enable linker-map output.
; post: demote vendored include dirs to -isystem, then run the size/layout gate.
; PlatformIO cannot subtract from an inherited list, so an env that skips a
; hook re-types the whole block.
extra_scripts =
    pre:tools/teensy_pre.py
    pre:tools/teensy_map.py
    post:tools/teensy_isystem.py
    post:tools/teensy_gate_extra.py

; Drops the Teensy core's optimization and -std=gnu++17 so the flags below win;
; the engine needs C++20.
build_unflags = -Os -O2 -std=gnu++17

build_flags =
    -O3                       ; owner-confirmed "Fastest" (o3std), no LTO
    ; Fast-math matched to the WASM release build. -ffast-math implies
    ; -ffinite-math-only, which folds std::isfinite() to true; parameter
    ; admission relies on it, so finite math is turned back off. Float results
    ; still differ from WASM; sim/device parity rests on the integer wrap guards.
    -ffast-math -fno-finite-math-only
    ; core/ headers include each other relative to core/; -I effects matches
    ; the VMicro include path.
    -I core
    -I effects
    -I hardware
    -D USB_SERIAL             ; USB type
    -D LAYOUT_US_ENGLISH      ; keyboard layout
    ; Strips assert(), whose newlib __assert_func pulls in stdio. <assert.h> is
    ; re-includable, so the define must be on the command line to bind every TU.
    ; HS_CHECK is unaffected.
    -D NDEBUG
    ; Silences FastLED's #pragma message banners. Defined empty to match
    ; FastLED's own `#define FASTLED_INTERNAL`; `-D X` would define 1 and warn.
    -D FASTLED_INTERNAL=
    -std=gnu++20              ; match VMicro CppLanguageStandard (Teensy default is gnu++17)
    ; VMicro user C++ flags, verbatim, so code size matches the bench:
    -fno-exceptions -fno-rtti -fno-threadsafe-statics
    -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-use-cxa-atexit
    ; VMicro warning suppressions:
    -Wno-psabi -Wno-deprecated -Wno-attributes
    -Wall -Wextra             ; warning hygiene — zero first-party warnings

lib_deps =
    ; FastLED 3.4.0, as bundled with Teensyduino 1.62.0. Later versions move
    ; CRGB/CHSV and the palette types into namespace fl.
    fastled/FastLED@3.4.0

; The non-header engine sources plus each env's converted sketch
; (targets/<X>/<X>.ino.cpp). -<*> keeps the repo-root src_dir from sweeping in
; everything else.
build_src_filter =
    -<*>
    +<core/memory.cpp>
    +<core/engine/static_storage.cpp>
    +<core/spatial/reaction_graph.cpp>

[env:holosphere]
board = teensy40
; RingSpin<96, 20> over WS2801 without column strobing: one FastLED show
; (1181 us worst case) fits the 1302 us column period. CANVAS_W/CANVAS_H set
; both the sketch's resolution and the shared framebuffers.
build_flags = ${env.build_flags} -D CANVAS_W=96 -D CANVAS_H=20
build_src_filter = ${env.build_src_filter} +<targets/Holosphere/Holosphere.ino.cpp>

[env:holosphere_dma]
board = teensy40
; Compile+link check for pov_single.h's USE_DMA_LEDS path, which no shipping
; image builds. Not budgeted: no size gate, no teensy_budgets.json entry.
build_flags = ${env.build_flags} -D USE_DMA_LEDS -D CANVAS_W=96 -D CANVAS_H=20
extra_scripts =
    pre:tools/teensy_pre.py
    pre:tools/teensy_map.py
    post:tools/teensy_isystem.py
build_src_filter = ${env.build_src_filter} +<targets/Holosphere/Holosphere.ino.cpp>

[env:phantasm]
board = teensy40
board_build.ldscript = tools/phantasm.ld
; DMA HD107S output. targets/Phantasm/phantasm_target.h defines USE_DMA_LEDS
; under #ifndef for Arduino-IDE/VMicro builds. -Os and newlib-nano
; (tools/teensy_nano.py) keep the image within RAM1; shipped firmware must use
; the same flags for the gate to predict its fit.
build_unflags = -O3 -O2 -std=gnu++17
build_flags = ${env.build_flags} -D USE_DMA_LEDS -D HS_PHANTASM_BOARD_REV=11 -Os
extra_scripts =
    ${env.extra_scripts}
    pre:tools/teensy_nano.py
build_src_filter = ${env.build_src_filter} +<targets/Phantasm/Phantasm.ino.cpp>

[env:profile]
board = teensy40
board_build.ldscript = tools/phantasm.ld
; Single-effect profiling image: the phantasm config plus HS_PROFILE counters.
; Select the effect with -D HS_PROFILE_TARGET=<EffectClass> in
; PLATFORMIO_BUILD_FLAGS (`just profile`). Not budgeted.
build_unflags = -O3 -O2 -std=gnu++17
build_flags = ${env.build_flags} -D USE_DMA_LEDS -D HS_PHANTASM_BOARD_REV=11 -Os -D HS_PROFILE_ENABLE -D HS_PROFILE_CONFIG_TAG=ship
extra_scripts =
    pre:tools/teensy_pre.py
    pre:tools/teensy_map.py
    post:tools/teensy_isystem.py
    pre:tools/teensy_nano.py
build_src_filter = ${env.build_src_filter} +<targets/Profile/Profile.ino.cpp>

[env:profile_o3]
board = teensy40
board_build.ldscript = tools/phantasm.ld
; [env:profile] at -O3: only the optimization level differs, for -O3/-Os A/B
; runs. A single-effect image fits FlexRAM at -O3. Not budgeted.
build_unflags = -Os -O2 -std=gnu++17
build_flags = ${env.build_flags} -D USE_DMA_LEDS -D HS_PHANTASM_BOARD_REV=11 -D HS_PROFILE_ENABLE -D HS_PROFILE_CONFIG_TAG=o3
extra_scripts =
    pre:tools/teensy_pre.py
    pre:tools/teensy_map.py
    post:tools/teensy_isystem.py
    pre:tools/teensy_nano.py
build_src_filter = ${env.build_src_filter} +<targets/Profile/Profile.ino.cpp>

[env:bench]
board = teensy40
board_build.ldscript = tools/phantasm.ld
; Stationary bench image: the phantasm config running BenchPattern alone. Not
; budgeted. HS_DEBUG_TELEMETRY prints the segment banner, reset cause, frame
; times and sync health counters over serial.
build_unflags = -O3 -O2 -std=gnu++17
build_flags = ${env.build_flags} -D USE_DMA_LEDS -D HS_PHANTASM_BOARD_REV=11 -Os -D HS_DEBUG_TELEMETRY
extra_scripts =
    pre:tools/teensy_pre.py
    pre:tools/teensy_map.py
    post:tools/teensy_isystem.py
    pre:tools/teensy_nano.py
build_src_filter = ${env.build_src_filter} +<targets/Bench/Bench.ino.cpp>

[env:phantasm8]
board = teensy40
board_build.ldscript = tools/phantasm.ld
; Compile+link coverage for the eight-board profile. Not budgeted until the
; N=8 rotor is mechanically qualified.
build_unflags = -O3 -O2 -std=gnu++17
build_flags = ${env.build_flags} -D USE_DMA_LEDS -D HS_PHANTASM_BOARD_REV=11 -D PHANTASM_NUM_SEGMENTS=8 -Os
extra_scripts =
    pre:tools/teensy_pre.py
    pre:tools/teensy_map.py
    post:tools/teensy_isystem.py
    pre:tools/teensy_nano.py
build_src_filter = ${env.build_src_filter} +<targets/Phantasm/Phantasm.ino.cpp>
