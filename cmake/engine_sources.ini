; Engine translation units, one repo-root-relative `+<path>` per line.
; platformio.ini loads this file through extra_configs and splices
; ${engine.sources} into build_src_filter; cmake/engine_sources.cmake reads the
; same lines into HS_ENGINE_SOURCES.
[engine]
sources =
    +<core/memory.cpp>
    +<core/engine/static_storage.cpp>
    +<core/spatial/reaction_graph.cpp>
    +<core/render/scan/mesh_capture.cpp>
